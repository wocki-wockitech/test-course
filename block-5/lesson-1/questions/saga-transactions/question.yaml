id: 277750c0-ca9d-43ff-85f0-8aa09b58e1f7
difficulty: 4
tags: [microservices, saga, transactions]

variants:
  - type: multiple_choice
    text: "Как Saga обеспечивает «откат» бизнес-операции при сбое на одном из шагов?"
    options:
      - text: "Выполняет компенсирующие действия — обратные операции для уже завершённых шагов"
        correct: true
        feedback: "Верно. Saga — это серия локальных транзакций плюс компенсации при сбое."
      - text: "Откатывает один общий распределённый ACID-коммит"
        feedback: "Нет, саги как раз нужны, чтобы не делать распределённый 2PC."
      - text: "Игнорирует сбой и продолжает дальше"
        feedback: "Нет, при сбое запускаются компенсации."
      - text: "Блокирует все сервисы до завершения операции"
        feedback: "Это про блокировки/2PC, а не про сагу."
    reference_answer: >
      Saga — последовательность локальных транзакций в разных сервисах. При
      сбое на шаге выполняются компенсирующие действия (обратные операции) для
      уже выполненных шагов. Бывает оркестрация и хореография.

  - type: true_false
    text: "В распределённой системе с at-least-once доставкой обработчик сообщения стоит делать идемпотентным."
    correct: true
    reference_answer: >
      При at-least-once сообщение может прийти повторно. Идемпотентность (по
      ключу/ID) гарантирует, что повтор не выполнит операцию дважды.
