id: 95117210-249d-44b5-ba99-5b09a06859cc
difficulty: 2
tags: [microservices, architecture, monolith]

variants:
  - type: multiple_choice
    text: "Что точнее всего описывает микросервис?"
    options:
      - text: "Независимо развёртываемый сервис вокруг одной бизнес-возможности, со своей БД"
        correct: true
        feedback: "Верно. Независимость деплоя и владение своими данными — суть подхода."
      - text: "Любой класс, вынесенный в отдельный файл"
        feedback: "Нет, это про организацию кода внутри одного приложения."
      - text: "Сервис, который обязательно написан на Go"
        feedback: "Язык не имеет значения, важна независимость и границы."
      - text: "Приложение без базы данных"
        feedback: "Наоборот, обычно у каждого сервиса своя БД."
    reference_answer: >
      Микросервис — независимо развёртываемый сервис, отвечающий за одну
      бизнес-возможность и владеющий своими данными. Общается с другими по сети.

  - type: true_false
    text: "Для нового небольшого продукта обычно дешевле начать с монолита, а не сразу делать микросервисы."
    correct: true
    reference_answer: >
      Микросервисы добавляют сложность распределённой системы. Чаще выгоднее
      начать с (модульного) монолита и выделять сервисы по мере реальной боли.
