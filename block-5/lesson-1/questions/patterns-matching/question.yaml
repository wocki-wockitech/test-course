id: ""
difficulty: 3
tags: [microservices, patterns, architecture]

variants:
  - type: matching
    text: "Сопоставь паттерн микросервисов с его назначением:"
    pairs:
      - left: "API Gateway"
        right: "Единая точка входа: маршрутизация, авторизация, rate limiting"
      - left: "Service Discovery"
        right: "Реестр, через который сервисы находят друг друга по имени"
      - left: "Circuit Breaker"
        right: "Размыкается при отказах зависимости и защищает от каскадных сбоев"
      - left: "Saga"
        right: "Бизнес-транзакция через несколько сервисов с компенсациями"
    distractors:
      - "Кеширование результатов SQL-запросов в памяти процесса"

  - type: multiple_choice
    text: "Зачем нужен Circuit Breaker?"
    options:
      - text: "Чтобы при стабильных отказах зависимости быстро отдавать ошибку/фолбэк и не копить зависшие вызовы"
        correct: true
        feedback: "Верно. Это защита от каскадных отказов и исчерпания ресурсов на таймаутах."
      - text: "Чтобы шифровать трафик между сервисами"
        feedback: "Нет, это про TLS/mTLS, не про breaker."
      - text: "Чтобы балансировать нагрузку по воркерам"
        feedback: "Это про балансировщик, не про circuit breaker."
      - text: "Чтобы хранить общий кеш для всех сервисов"
        feedback: "Это про распределённый кеш, не про breaker."
    reference_answer: >
      Circuit breaker отслеживает ошибки к зависимости и при превышении порога
      «размыкается»: запросы быстро падают/идут в фолбэк, что предотвращает
      каскадные отказы и исчерпание пулов на таймаутах.
