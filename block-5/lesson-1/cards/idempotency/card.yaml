id: 17dc8f02-d7b4-468d-8892-61e4572192da
difficulty: 3
tags: [microservices, idempotency, reliability]

questions:
  - type: multiple_choice
    text: "Что значит, что операция идемпотентна?"
    options:
      - text: "Повторное выполнение с теми же входными данными не меняет результат"
        correct: true
        feedback: "Верно. Это защищает от дублей при ретраях и повторной доставке."
      - text: "Операция всегда выполняется быстро"
        feedback: "Скорость тут ни при чём."
      - text: "Операция не использует сеть"
        feedback: "Нет, идемпотентность не про сеть, а про повторяемость результата."
      - text: "Операция выполняется ровно один раз физически"
        feedback: "Идемпотентность не гарантирует единственного выполнения, а делает повтор безопасным."
    reference_answer: >
      Идемпотентная операция при повторе с теми же данными даёт тот же
      результат и не вызывает побочных эффектов дважды. Реализуется через ключ
      идемпотентности или проверку уже обработанного ID.

  - type: true_false
    text: "Без идемпотентности автоматические ретраи запросов могут привести к дублирующим побочным эффектам (например, двойному списанию)."
    correct: true
    reference_answer: >
      Ретрай повторяет вызов. Если операция не идемпотентна, побочный эффект
      произойдёт повторно — отсюда двойные списания и дубли.
