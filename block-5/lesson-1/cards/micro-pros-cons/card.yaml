id: ec4d8ae8-ecbe-4d55-a377-018fcfe95ab9
difficulty: 3
tags: [microservices, architecture, tradeoffs]

questions:
  - type: categorize
    text: "Раздели свойства на плюсы и минусы микросервисной архитектуры:"
    categories:
      - name: "Плюсы"
        items:
          - "Независимый деплой сервисов"
          - "Точечное масштабирование узких мест"
          - "Разные языки и хранилища под задачу"
          - "Команды работают независимо"
      - name: "Минусы"
        items:
          - "Сложность распределённой системы"
          - "Распределённые транзакции и eventual consistency"
          - "Сложнее отладка и наблюдаемость"
          - "Накладные расходы на сетевые вызовы"
    distractors:
      - "Локальные ACID-транзакции из коробки"

  - type: multiple_choice
    text: "Какой минус характерен именно для микросервисов, а не для монолита?"
    options:
      - text: "Бизнес-операция через несколько сервисов теряет локальные ACID-транзакции"
        correct: true
        feedback: "Верно. Появляются распределённые транзакции и eventual consistency."
      - text: "Нельзя масштабировать приложение горизонтально"
        feedback: "Наоборот, точечное масштабирование — это плюс микросервисов."
      - text: "Невозможно использовать разные языки"
        feedback: "Наоборот, разные стеки — это возможность микросервисов."
      - text: "Один деплой ломает всё приложение"
        feedback: "Это скорее риск монолита; у микросервисов деплой независимый."
    reference_answer: >
      В монолите транзакция локальна и ACID. В микросервисах бизнес-операция
      размазана по сервисам, нужны саги и приходится мириться с eventual
      consistency.
