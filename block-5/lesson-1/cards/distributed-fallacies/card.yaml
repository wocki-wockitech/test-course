id: 47cb888e-61fd-4494-bd55-da617d29c3f6
difficulty: 3
tags: [microservices, distributed-systems, observability]

questions:
  - type: multiple_choice
    text: "Зачем нужен distributed tracing в микросервисах?"
    options:
      - text: "Чтобы по общему trace_id проследить путь одного запроса через все сервисы"
        correct: true
        feedback: "Верно. Трейсинг связывает спаны в один путь и показывает, где потеряно время или возникла ошибка."
      - text: "Чтобы хранить логи только одного сервиса"
        feedback: "Это про логирование одного сервиса, а трейсинг сшивает путь между сервисами."
      - text: "Чтобы ускорить сетевые вызовы"
        feedback: "Трейсинг ничего не ускоряет, он про наблюдаемость."
      - text: "Чтобы заменить базу данных"
        feedback: "Не относится к хранению данных."
    reference_answer: >
      Один запрос проходит через много сервисов. Distributed tracing прокидывает
      общий trace_id, собирая спаны в единый путь — видно, где задержка и какой
      сервис вернул ошибку (OpenTelemetry, Jaeger, Zipkin).

  - type: true_false
    text: "Одно из «заблуждений о распределённых вычислениях» — считать, что сеть надёжна; на самом деле любой сетевой вызов может упасть или зависнуть."
    correct: true
    reference_answer: >
      Сеть ненадёжна, latency не ноль, топология меняется. Поэтому нужны
      таймауты, ретраи и идемпотентность.
