id: ""
difficulty: 3
tags: [grpc, rest, architecture]

variants:
  - type: multiple_choice
    text: "В каком случае gRPC обычно предпочтительнее REST?"
    options:
      - text: "Внутренняя коммуникация между сервисами с низкой задержкой, высоким RPS и стримингом"
        correct: true
        feedback: "Верно. Бинарный protobuf + HTTP/2 + строгий контракт хорошо подходят для service-to-service."
      - text: "Публичный API, который должен вызываться напрямую из браузера"
        feedback: "Для браузера и публичных API удобнее REST/JSON."
      - text: "Когда важна ручная отладка запросов через curl"
        feedback: "REST/JSON человекочитаем и проще для ручной отладки."
      - text: "Когда нужно максимально широкое кеширование через HTTP-прокси"
        feedback: "HTTP-кеширование лучше ложится на REST."
    reference_answer: >
      gRPC хорош для внутренней связи сервисов: низкая задержка, высокий RPS,
      стриминг, строгий контракт и кодогенерация. REST/JSON удобнее для
      публичных API, браузера и ручной отладки.

  - type: categorize
    text: "Раздели задачи по подходящему протоколу:"
    categories:
      - name: "Скорее gRPC"
        items:
          - "Высоконагруженный обмен между внутренними сервисами"
          - "Двунаправленный стриминг в реальном времени"
          - "Строгий типобезопасный контракт с кодогенерацией"
      - name: "Скорее REST"
        items:
          - "Публичный API для сторонних разработчиков"
          - "Прямой вызов из браузера"
          - "Простая отладка через curl и человекочитаемый JSON"
