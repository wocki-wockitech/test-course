id: ""
difficulty: 4
tags: [grpc, protobuf, compatibility]

variants:
  - type: multiple_choice
    text: "Посмотри изменения сообщения в файле. Какой вариант НЕ ломает обратную совместимость?"
    file: service.proto
    options:
      - text: "Вариант A — добавлено новое поле с новым номером"
        correct: true
        feedback: "Верно. Старые клиенты проигнорируют поле 4, новые прочитают — это безопасно."
      - text: "Вариант B — переиспользован номер 2 под другое поле"
        feedback: "Это ломает совместимость: старые данные по тегу 2 прочитаются как мусор."
      - text: "Вариант C — изменён номер существующего поля"
        feedback: "Смена номера поля ломает бинарную совместимость."
      - text: "Ни один вариант не безопасен"
        feedback: "Вариант A безопасен — новое поле с новым номером."
    reference_answer: >
      Безопасно добавлять новые поля с новыми номерами (вариант A).
      Переиспользование номера удалённого поля (B) и смена номера
      существующего поля (C) ломают бинарную совместимость, так как тег поля —
      это то, что реально передаётся в protobuf.

  - type: true_false
    text: "При удалении поля в protobuf его номер следует пометить `reserved`, чтобы случайно не переиспользовать."
    correct: true
    reference_answer: >
      reserved запрещает повторно занять номер (и имя) удалённого поля, защищая
      от поломки совместимости со старыми данными и клиентами.
