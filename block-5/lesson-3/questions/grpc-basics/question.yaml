id: 22d3004f-9ff8-4e3a-84ed-aa24b9acf6b4
difficulty: 2
tags: [grpc, protobuf, http2]

variants:
  - type: multiple_choice
    text: "На каких двух технологиях построен gRPC?"
    options:
      - text: "HTTP/2 как транспорт и Protocol Buffers как формат сериализации"
        correct: true
        feedback: "Верно. HTTP/2 даёт мультиплексирование и стриминг, protobuf — компактный бинарный контракт."
      - text: "HTTP/1.1 и JSON"
        feedback: "Это про обычный REST, а не gRPC."
      - text: "WebSocket и XML"
        feedback: "Нет, gRPC использует HTTP/2 и protobuf."
      - text: "TCP напрямую и YAML"
        feedback: "Нет, транспорт — HTTP/2, формат — protobuf."
    reference_answer: >
      gRPC — это RPC поверх HTTP/2 с сериализацией через Protocol Buffers.
      HTTP/2 даёт мультиплексирование и стриминг, protobuf — компактный бинарный
      формат и строгую схему.

  - type: true_false
    text: "Из .proto-файла кодогенератор создаёт клиент и сервер для разных языков."
    correct: true
    reference_answer: >
      Контракт описан один раз в .proto, а из него генерируются типобезопасные
      стабы клиента и сервера на нужных языках.
