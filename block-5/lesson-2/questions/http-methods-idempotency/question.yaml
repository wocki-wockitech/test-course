id: ""
difficulty: 3
tags: [rest, http, idempotency]

variants:
  - type: matching
    text: "Сопоставь HTTP-метод с его свойством идемпотентности:"
    pairs:
      - left: "GET"
        right: "Идемпотентный и безопасный (только чтение)"
      - left: "POST"
        right: "Не идемпотентный (каждый раз создаёт новый ресурс)"
      - left: "PUT"
        right: "Идемпотентный (повтор даёт то же состояние ресурса)"
      - left: "DELETE"
        right: "Идемпотентный (ресурс остаётся удалённым)"

  - type: multiple_choice
    text: "Почему PUT идемпотентен, а POST — нет?"
    options:
      - text: "PUT задаёт конечное состояние ресурса, повтор не меняет его; POST создаёт новый ресурс при каждом вызове"
        correct: true
        feedback: "Верно. В этом ключевая разница для ретраев."
      - text: "PUT не использует тело запроса, а POST использует"
        feedback: "Оба могут иметь тело; дело не в этом."
      - text: "POST идемпотентен, а PUT — нет"
        feedback: "Наоборот: PUT идемпотентен, POST — нет."
      - text: "Оба идемпотентны одинаково"
        feedback: "Нет, POST не идемпотентен по определению."
    reference_answer: >
      PUT заменяет ресурс целиком на переданное состояние, поэтому повтор того
      же запроса не меняет результат. POST создаёт новую сущность при каждом
      вызове, значит повтор порождает дубли.
