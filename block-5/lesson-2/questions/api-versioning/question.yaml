id: a7bd4d43-a4ed-422c-8830-cabd854c62a4
difficulty: 2
tags: [rest, versioning, api]

variants:
  - type: multiple_choice
    text: "Какое изменение НЕ ломает обратную совместимость в рамках одной версии API?"
    options:
      - text: "Добавление нового опционального поля в ответ"
        correct: true
        feedback: "Верно. Старые клиенты его просто проигнорируют."
      - text: "Удаление существующего поля из ответа"
        feedback: "Это ломает клиентов, которые на него рассчитывают."
      - text: "Изменение смысла существующего поля"
        feedback: "Смена семантики поля ломает совместимость."
      - text: "Превращение опционального параметра в обязательный"
        feedback: "Старые клиенты перестанут проходить валидацию."
    reference_answer: >
      Совместимое изменение — добавление опциональных полей. Удаление полей,
      смена их смысла и ужесточение обязательности — ломающие изменения,
      требующие новой версии.

  - type: multiple_choice
    text: "Какой способ версионирования REST API самый явный и распространённый?"
    options:
      - text: "Версия в пути: `/v1/users`, `/v2/users`"
        correct: true
        feedback: "Верно. Виден прямо в URL, прост в роутинге и отладке."
      - text: "Версия по IP-адресу клиента"
        feedback: "Так версии не задают."
      - text: "Версия по времени суток"
        feedback: "Это бессмыслица."
      - text: "Без версий — всегда ломать старых клиентов"
        feedback: "Это и есть отсутствие версионирования."
    reference_answer: >
      Самый популярный и явный подход — версия в пути (/v1/...). Также бывает
      версия в заголовке Accept или в query-параметре.
