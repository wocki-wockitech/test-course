id: 7738ed9e-9f14-4a1a-b9b5-4b15950e74db
difficulty: 2
tags: [kafka, partitions, offset]

questions:
  - type: multiple_choice
    text: "Что такое offset в Kafka?"
    options:
      - text: "Порядковый номер сообщения внутри партиции"
        correct: true
        feedback: "Да. Консьюмер коммитит offset, чтобы помнить, докуда дочитал."
      - text: "Уникальный номер сообщения по всему топику"
        feedback: "Нет, offset уникален в пределах партиции, а не топика целиком."
      - text: "Имя партиции"
        feedback: "Нет, это позиция, а не имя."
      - text: "Хэш ключа сообщения"
        feedback: "Нет, по хэшу ключа выбирается партиция, а не offset."
    reference_answer: >
      Offset — порядковый номер сообщения внутри партиции. Консьюмер хранит
      (коммитит) свой offset и так помнит позицию чтения; сдвиг назад = перечитать.

  - type: true_false
    text: "Партиция — это единица параллелизма: больше партиций позволяет подключить больше параллельных консьюмеров в группе."
    correct: true
    reference_answer: >
      Да. В пределах группы одну партицию читает один консьюмер, поэтому
      параллелизм обработки ограничен числом партиций.
