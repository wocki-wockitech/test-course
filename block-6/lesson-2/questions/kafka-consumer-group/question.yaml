id: ""
difficulty: 3
tags: [kafka, consumer-group, scaling]

variants:
  - type: multiple_choice
    text: "Сколько консьюмеров из одной consumer group читают одну партицию?"
    options:
      - text: "Ровно один"
        correct: true
        feedback: "Да. В пределах группы партиция закреплена за одним консьюмером."
      - text: "Все консьюмеры группы сразу"
        feedback: "Нет, тогда сообщения дублировались бы внутри группы."
      - text: "Не больше двух"
        feedback: "Нет, ровно один в пределах группы."
      - text: "Зависит от retention"
        feedback: "Нет, retention тут ни при чём."
    reference_answer: >
      Каждую партицию в группе читает ровно один консьюмер. Поэтому параллелизм
      обработки в группе ограничен числом партиций.

  - type: true_false
    text: "Если консьюмеров в группе больше, чем партиций, лишние консьюмеры будут простаивать."
    correct: true
    reference_answer: >
      Да. Партиция отдаётся одному консьюмеру, и если консьюмеров больше числа
      партиций, часть из них останется без работы.
