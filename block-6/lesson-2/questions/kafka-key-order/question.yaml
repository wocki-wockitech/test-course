id: ""
difficulty: 3
tags: [kafka, ordering, partition-key]

variants:
  - type: multiple_choice
    text: "В каком объёме Kafka гарантирует порядок сообщений?"
    options:
      - text: "Только внутри одной партиции"
        correct: true
        feedback: "Верно. Глобального порядка по топику нет, только внутри партиции."
      - text: "По всему топику целиком"
        feedback: "Нет, между партициями порядок не гарантируется."
      - text: "По всему кластеру"
        feedback: "Нет, такого глобального порядка нет."
      - text: "Порядок вообще не гарантируется"
        feedback: "Внутри партиции — гарантируется."
    reference_answer: >
      Порядок гарантируется только внутри партиции. Чтобы упорядочить события
      сущности, используют её id как ключ — тогда они лягут в одну партицию.

  - type: true_false
    text: "Если задать ключ сообщения, Kafka по его хэшу всегда направит сообщения с одним ключом в одну и ту же партицию."
    correct: true
    reference_answer: >
      Да. Сообщения с одинаковым ключом попадают в одну партицию, что даёт
      упорядоченность по этому ключу. Без ключа — равномерное распределение.

  - type: ordering
    text: "Расположи шаги выбора партиции продюсером при наличии ключа:"
    items:
      - "Producer задаёт сообщению ключ"
      - "Kafka вычисляет хэш ключа"
      - "По хэшу выбирается номер партиции"
      - "Сообщение дописывается в конец этой партиции"
