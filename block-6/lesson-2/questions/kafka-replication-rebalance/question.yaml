id: b03ab189-ce19-4660-b0df-b2ad553de3bf
difficulty: 4
tags: [kafka, replication, isr, rebalance]

variants:
  - type: multiple_choice
    text: "Что такое ISR (In-Sync Replicas) в Kafka?"
    options:
      - text: "Реплики партиции, которые успевают догонять лидера"
        correct: true
        feedback: "Да. acks=all + min.insync.replicas опираются на ISR для надёжности."
      - text: "Список консьюмеров в группе"
        feedback: "Нет, ISR — про реплики партиции, а не консьюмеров."
      - text: "Очередь необработанных сообщений"
        feedback: "Нет, это не очередь сообщений."
      - text: "Индекс offset на диске"
        feedback: "Нет, это про реплики, а не индекс."
    reference_answer: >
      ISR — реплики партиции, синхронные с лидером. С acks=all и
      min.insync.replicas запись подтверждается только после записи в нужное
      число синхронных реплик, что защищает от потери данных.

  - type: multiple_choice
    text: "Что такое rebalance в consumer group и почему частые ребалансы — это плохо?"
    options:
      - text: "Перераспределение партиций между консьюмерами; во время него обработка в группе приостанавливается"
        correct: true
        feedback: "Верно. Классический протокол делает stop-the-world, отсюда просадки."
      - text: "Перенос сообщений между топиками для балансировки диска"
        feedback: "Нет, rebalance про распределение партиций по консьюмерам."
      - text: "Удаление старых сообщений по retention"
        feedback: "Нет, это retention/compaction, а не rebalance."
      - text: "Переключение лидера партиции на фолловера"
        feedback: "Это leader election, а не rebalance консьюмеров."
    reference_answer: >
      Rebalance — перераспределение партиций между консьюмерами группы при
      входе/выходе консьюмера или изменении числа партиций. Обработка на это
      время встаёт, поэтому частые ребалансы бьют по throughput.

  - type: true_false
    text: "В Kafka все чтения и записи партиции идут через её лидера, а фолловеры догоняют его."
    correct: true
    reference_answer: >
      Да. Лидер обслуживает запись/чтение, фолловеры реплицируют данные; при
      падении лидера один из синхронных фолловеров становится новым лидером.
