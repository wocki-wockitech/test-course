id: 1524c71a-c40c-4bc8-9b07-e8b52e00d209
difficulty: 3
tags: [rabbitmq, ack, dlq]

questions:
  - type: multiple_choice
    text: "Когда правильнее всего отправлять ack для надёжной обработки?"
    options:
      - text: "После успешной обработки сообщения"
        correct: true
        feedback: "Да. Тогда при падении до ack брокер переотправит — это at-least-once."
      - text: "До начала обработки (autoack)"
        feedback: "Нет, при падении консьюмера сообщение потеряется — это at-most-once."
      - text: "Никогда, ack не нужен"
        feedback: "Без ack брокер не узнает об успехе обработки."
      - text: "Только если очередь переполнена"
        feedback: "Нет, ack не зависит от заполненности очереди."
    reference_answer: >
      ack ставят после успешной обработки. Если консьюмер упал до ack, брокер
      вернёт сообщение в очередь и переотправит (at-least-once).

  - type: true_false
    text: "Dead Letter Queue нужна, чтобы «ядовитые» сообщения не зацикливались на переобработке, а уходили в отдельную очередь для разбора."
    correct: true
    reference_answer: >
      Да. В DLQ попадают сообщения, отклонённые с requeue=false, протухшие по TTL
      или превысившие лимит повторов — это защищает от бесконечного цикла.

  - type: matching
    text: "Сопоставь действие консьюмера с результатом:"
    pairs:
      - left: "ack"
        right: "Брокер удаляет сообщение"
      - left: "nack с requeue=true"
        right: "Сообщение возвращается в очередь"
      - left: "nack с requeue=false"
        right: "Сообщение уходит дальше, например в DLQ"
