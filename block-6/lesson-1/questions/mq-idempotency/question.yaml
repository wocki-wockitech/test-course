id: ""
difficulty: 3
tags: [mq, idempotency, consumer]

variants:
  - type: multiple_choice
    text: "Что значит «идемпотентный консьюмер»?"
    options:
      - text: "Повторная обработка того же сообщения не меняет итоговый результат"
        correct: true
        feedback: "Да. Дубль обрабатывается безопасно, как будто его и не было."
      - text: "Консьюмер обрабатывает только по одному сообщению за раз"
        feedback: "Нет, это про конкурентность/prefetch, а не идемпотентность."
      - text: "Консьюмер никогда не получает дублей"
        feedback: "Нет, дубли он получить может; смысл в том, что они безвредны."
      - text: "Консьюмер всегда отвечает продюсеру"
        feedback: "Нет, это не про идемпотентность."
    reference_answer: >
      Идемпотентность — повторная обработка того же сообщения даёт тот же
      результат. Нужна, потому что при at-least-once дубли неизбежны.

  - type: categorize
    text: "Раздели приёмы по тому, помогают ли они сделать консьюмер идемпотентным:"
    categories:
      - name: "Помогает идемпотентности"
        items: ["Хранение обработанных message id", "Upsert вместо insert", "Условная операция по ключу идемпотентности"]
      - name: "Не про идемпотентность"
        items: ["Увеличение prefetch", "Добавление новых консьюмеров"]
    distractors:
      - "Включение autoack"
