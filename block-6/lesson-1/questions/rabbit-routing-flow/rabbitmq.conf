# RabbitMQ broker config (rabbitmq.conf)
# Слушатель AMQP
listeners.tcp.default = 5672

# Management-плагин
management.tcp.port = 15672

# Лимит неподтверждённых сообщений на консьюмера по умолчанию
# (аналог basic.qos prefetch)
default_consumer_prefetch = 20

# Память: при превышении брокер включает back-pressure на продюсеров
vm_memory_high_watermark.relative = 0.6

# Сообщения по умолчанию персистентные на диск
queue_master_locator = min-masters
