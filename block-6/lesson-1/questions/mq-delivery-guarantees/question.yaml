id: 4d22f332-f668-4551-9eda-75ffa38fa8e9
difficulty: 3
tags: [mq, delivery, guarantees]

variants:
  - type: matching
    text: "Сопоставь гарантию доставки с её смыслом:"
    pairs:
      - left: "at-most-once"
        right: "Возможна потеря, но дублей не будет"
      - left: "at-least-once"
        right: "Потерь нет, но возможны дубли"
      - left: "exactly-once"
        right: "Без потерь и без дублей, но дорого и сложно"

  - type: multiple_choice
    text: "Почему при at-least-once возможны дубли сообщений?"
    options:
      - text: "Консьюмер может упасть после обработки, но до отправки ack — тогда сообщение переотправят"
        correct: true
        feedback: "Верно. Нет ack — брокер считает сообщение необработанным и шлёт снова."
      - text: "Брокер случайно копирует каждое сообщение дважды"
        feedback: "Нет, дубли — следствие переотправки при отсутствии ack."
      - text: "Продюсер всегда шлёт всё дважды для надёжности"
        feedback: "Нет, это не обязательное поведение продюсера."
      - text: "Из-за нехватки места в очереди"
        feedback: "Нет, переполнение не создаёт дубли."
    reference_answer: >
      Если консьюмер обработал сообщение, но упал до ack, брокер не получит
      подтверждение и переотправит сообщение — отсюда дубли.

  - type: true_false
    text: "На практике exactly-once часто эмулируют через at-least-once плюс идемпотентность консьюмера."
    correct: true
    reference_answer: >
      Да. Чистый exactly-once на уровне сети почти недостижим, поэтому берут
      at-least-once и делают обработку идемпотентной.
