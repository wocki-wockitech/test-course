id: cc60bbc2-558b-4a68-bf59-f007a97c5f5c
difficulty: 1
tags: [mq, basics, architecture]

variants:
  - type: multiple_choice
    text: "Какую главную проблему решает очередь сообщений между сервисами?"
    options:
      - text: "Развязывает продюсера и консьюмера и сглаживает пиковую нагрузку"
        correct: true
        feedback: "Да. Decoupling + load leveling + асинхронность — три главных причины."
      - text: "Ускоряет SQL-запросы к базе"
        feedback: "Нет, это не про оптимизацию БД."
      - text: "Заменяет необходимость в балансировщике нагрузки"
        feedback: "Нет, очередь не балансировщик HTTP-трафика."
      - text: "Гарантирует, что код не содержит багов"
        feedback: "Очевидно нет, очередь про доставку сообщений."
    reference_answer: >
      Очередь развязывает отправителя и получателя (decoupling), сглаживает
      пиковую нагрузку (load leveling) и позволяет выполнять тяжёлую работу
      асинхронно, не блокируя запрос пользователя.

  - type: true_false
    text: "Очередь позволяет вынести тяжёлую работу из HTTP-запроса и ответить пользователю сразу."
    correct: true
    reference_answer: >
      Да. Кладём задачу в очередь и сразу отвечаем; обработку делает консьюмер
      асинхронно.
