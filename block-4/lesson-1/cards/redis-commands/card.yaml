difficulty: 3
tags: [redis, commands, data-structures]

questions:
  - type: multiple_choice
    text: "Посмотри сессию redis-cli в файле. Что вернёт `GET counter` после первых четырёх команд?"
    file: commands.txt
    options:
      - text: "16"
        correct: true
        feedback: "Верно: SET 10, INCR → 11, INCRBY 5 → 16."
      - text: "10"
        feedback: "Нет, после INCR и INCRBY значение изменилось."
      - text: "15"
        feedback: "Нет: 10 + 1 (INCR) + 5 (INCRBY) = 16, а не 15."
      - text: "11"
        feedback: "Это значение только после INCR, но был ещё INCRBY 5."
    reference_answer: >
      SET counter 10, затем INCR → 11, затем INCRBY counter 5 → 16. GET вернёт
      строку "16". Числа в Redis хранятся как строки, но INCR/INCRBY работают
      с ними атомарно.

  - type: multiple_choice
    text: "В той же сессии: что вернёт `SCARD tags` и `LRANGE queue 0 -1`?"
    file: commands.txt
    options:
      - text: "SCARD = 2 (set хранит уникальные), список: x, a, b, c"
        correct: true
        feedback: "Верно: дубль redis не считается; LPUSH x кладёт в голову."
      - text: "SCARD = 3, список: a, b, c, x"
        feedback: "Нет: redis добавлен дважды, но в set он один → 2. И x ушёл в голову."
      - text: "SCARD = 2, список: a, b, c, x"
        feedback: "SCARD верно, но LPUSH x добавляет в начало, а не в конец."
      - text: "SCARD = 3, список: x, a, b, c"
        feedback: "Список верный, но в set redis уникален → 2, а не 3."
    reference_answer: >
      Set хранит только уникальные значения, поэтому SADD redis cache redis даёт
      2 элемента. RPUSH добавил a,b,c в хвост, а LPUSH x — в голову, итог:
      x, a, b, c.
