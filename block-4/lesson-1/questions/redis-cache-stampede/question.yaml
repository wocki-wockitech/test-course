id: ""
difficulty: 4
tags: [redis, cache, stampede, performance]

variants:
  - type: multiple_choice
    text: "Что такое cache stampede (thundering herd)?"
    options:
      - text: "Популярный ключ протух, и множество запросов одновременно бьют в БД, перегружая её"
        correct: true
        feedback: "Верно. Промах под нагрузкой приводит к лавине запросов в БД."
      - text: "Redis закончилась память и он начал вытеснять ключи"
        feedback: "Это про eviction, а не stampede."
      - text: "Данные в кеше рассинхронизировались с БД"
        feedback: "Это проблема консистентности/инвалидации, не stampede."
      - text: "Сетевой сбой между приложением и Redis"
        feedback: "Нет, stampede — про лавину промахов на горячем ключе."
    reference_answer: >
      Cache stampede — когда горячий ключ протухает и одновременно много
      запросов получают промах и идут в БД, создавая пиковую нагрузку.

  - type: multiple_choice
    text: "Какой приём НЕ помогает бороться с cache stampede?"
    options:
      - text: "Поставить всем ключам одинаковый фиксированный TTL без разброса"
        correct: true
        feedback: "Верно, это только усугубляет: ключи протухнут разом. Нужен jitter."
      - text: "Мьютекс/лок через SETNX — пересчитывает только один запрос"
        feedback: "Это валидный приём против stampede."
      - text: "Stale-while-revalidate — отдавать старое значение, пока идёт пересчёт"
        feedback: "Это валидный приём против stampede."
      - text: "Jitter — случайный разброс TTL"
        feedback: "Это валидный приём против stampede."
    reference_answer: >
      Одинаковый TTL без разброса приводит к массовому одновременному истечению.
      Помогают: лок на пересчёт (SETNX), early recomputation,
      stale-while-revalidate и jitter (разброс TTL).
