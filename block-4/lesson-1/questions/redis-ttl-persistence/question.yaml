id: b3cd8c01-3b06-4dc5-9c59-58055f3c3dbc
difficulty: 3
tags: [redis, ttl, persistence, rdb, aof]

variants:
  - type: multiple_choice
    text: "Чем RDB отличается от AOF в Redis?"
    options:
      - text: "RDB — периодический снапшот датасета, AOF — журнал команд на запись"
        correct: true
        feedback: "Верно. RDB компактный и быстро грузится, AOF теряет меньше данных."
      - text: "RDB пишет в память, AOF — на диск"
        feedback: "Оба про сохранение на диск; RDB и AOF — это форматы персистентности."
      - text: "RDB — это репликация, AOF — это шардирование"
        feedback: "Нет, это про сохранение данных на диск, а не про масштабирование."
      - text: "AOF быстрее загружается при старте, чем RDB"
        feedback: "Наоборот: RDB грузится быстрее, восстановление из AOF медленнее."
    reference_answer: >
      RDB — бинарный снапшот всего датасета через интервалы: компактный, быстро
      грузится, но теряет изменения с момента снимка. AOF — лог всех команд на
      запись: меньше потерь (fsync раз в секунду/на команду), но файл больше и
      восстановление медленнее. Часто включают оба.

  - type: true_false
    text: "Команда `SET key value` без флага KEEPTTL сбрасывает ранее установленный для ключа TTL."
    correct: true
    reference_answer: >
      Да. Обычный SET перезаписывает ключ и убирает expire. Чтобы сохранить TTL,
      нужен `SET ... KEEPTTL` или отдельный `EXPIRE`.

  - type: ordering
    text: "Расположи команды так, чтобы ключ был создан, получил TTL, а затем TTL был снят:"
    items:
      - "SET user:1 \"Alice\""
      - "EXPIRE user:1 600"
      - "PERSIST user:1"
