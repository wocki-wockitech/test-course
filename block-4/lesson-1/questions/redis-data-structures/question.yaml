tags: [redis, data-structures]

variants:
  - type: categorize
    text: "Подбери структуру данных Redis под задачу:"
    categories:
      - name: "Sorted Set (ZSet)"
        items: ["Лидерборд игроков по очкам", "Очередь с приоритетом", "Выборка по диапазону score"]
      - name: "Hash"
        items: ["Хранить объект пользователя по полям", "Профиль с отдельными атрибутами"]
      - name: "List"
        items: ["Очередь задач FIFO", "Лента последних N событий"]
      - name: "Set"
        items: ["Уникальные теги", "Пересечение аудиторий"]
    distractors:
      - "JOIN двух таблиц по внешнему ключу"
      - "Полнотекстовый поиск с ранжированием"

  - type: matching
    text: "Сопоставь структуру данных Redis с типичной командой:"
    pairs:
      - left: "String (счётчик)"
        right: "INCR"
      - left: "Hash"
        right: "HSET"
      - left: "List"
        right: "LPUSH"
