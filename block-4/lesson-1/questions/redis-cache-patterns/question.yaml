id: 76552862-dae0-45fa-9dc1-5b9bb6ad4b82
difficulty: 3
tags: [redis, cache, patterns]

variants:
  - type: matching
    text: "Сопоставь паттерн кеширования с его сутью:"
    pairs:
      - left: "Cache-aside"
        right: "Приложение само читает кеш, при промахе идёт в БД и кладёт результат"
      - left: "Read-through"
        right: "Чтение всегда через кеш, кеш сам подтягивает данные из БД при промахе"
      - left: "Write-through"
        right: "Запись синхронно в кеш и в БД одновременно"
      - left: "Write-behind"
        right: "Запись в кеш, а в БД асинхронно позже"

  - type: multiple_choice
    text: "Какой паттерн самый распространённый и означает, что приложение само управляет кешем (читает кеш, при промахе идёт в БД и наполняет кеш)?"
    options:
      - text: "Cache-aside (lazy loading)"
        correct: true
        feedback: "Верно. Логика кеша на стороне приложения, наполнение по промаху."
      - text: "Write-behind"
        feedback: "Нет, это про асинхронную запись в БД."
      - text: "Write-through"
        feedback: "Нет, это про синхронную запись в кеш и БД."
      - text: "Read-through"
        feedback: "Близко, но там логика подтягивания в слое кеша, а не в приложении."
    reference_answer: >
      Cache-aside (lazy loading): приложение читает из кеша, при промахе берёт
      данные из БД и сам кладёт их в кеш с TTL. Самый частый паттерн.

  - type: true_false
    text: "При write-behind есть риск потерять данные, если узел упадёт до того, как асинхронная запись дойдёт до БД."
    correct: true
    reference_answer: >
      Да. Write-behind пишет в БД асинхронно позже, поэтому при падении до
      сброса часть изменений может потеряться. Цена за быструю запись.
