id: 2399a24c-c152-41fb-b7b9-8e151f99f417
difficulty: 3
tags: [mongodb, nosql, sql, architecture]

questions:
  - type: multiple_choice
    text: "Когда документная БД вроде MongoDB подходит ЛУЧШЕ реляционной?"
    options:
      - text: "Гибкая схема и данные читаются как единый агрегат (документ целиком)"
        correct: true
        feedback: "Верно. Документная модель сильна, когда читаем агрегат без JOIN."
      - text: "Много сильно связанных данных и постоянные JOIN между ними"
        feedback: "Это сценарий для SQL, где JOIN и связи — родная задача."
      - text: "Нужны строгие межтабличные транзакции ACID и целостность по ключам"
        feedback: "Это классическая сильная сторона реляционных БД."
      - text: "Схема жёстко фиксирована и почти не меняется"
        feedback: "Стабильная строгая схема — аргумент за SQL, а не за NoSQL."
    reference_answer: >
      Документная БД выигрывает при гибкой/меняющейся схеме, когда данные
      читаются единым агрегатом и нужна простая горизонтальная масштабируемость.
      Сильные связи, JOIN и строгий ACID — это в пользу SQL.

  - type: true_false
    text: "Гибкая схема в MongoDB означает, что модель данных проектировать не нужно."
    correct: false
    reference_answer: >
      Нет. Схему всё равно проектируют — на уровне приложения и под паттерны
      доступа (как читаем, так и храним: embedding vs referencing).
