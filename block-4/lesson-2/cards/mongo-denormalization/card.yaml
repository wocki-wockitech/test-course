id: b0668873-46b8-4801-98bb-4c02da012ba1
difficulty: 3
tags: [mongodb, denormalization, indexes, schema]

questions:
  - type: matching
    text: "Сопоставь подход к моделированию связей в MongoDB с тем, когда он уместен:"
    pairs:
      - left: "Embedding (вложение)"
        right: "Данные читаются вместе, ограничены по размеру, один-ко-многим"
      - left: "Referencing (ссылки по _id)"
        right: "Большие/часто меняющиеся данные, отношения many-to-many"
      - left: "TTL-индекс"
        right: "Авто-удаление документов по истечении времени"
      - left: "Составной индекс"
        right: "Поиск/сортировка по нескольким полям, где важен их порядок"

  - type: multiple_choice
    text: "Что верно про денормализацию в документных БД?"
    options:
      - text: "Ускоряет чтение ценой дублирования и усложнения обновлений"
        correct: true
        feedback: "Верно. Читаем за одно обращение, но одни данные обновляем в нескольких местах."
      - text: "Полностью убирает дублирование данных"
        feedback: "Наоборот: денормализация осознанно допускает дублирование."
      - text: "Всегда требует JOIN при каждом чтении"
        feedback: "Смысл как раз в том, чтобы избежать JOIN, читая агрегат целиком."
      - text: "Замедляет чтение, но ускоряет запись"
        feedback: "Обычно наоборот: чтение быстрее, запись/обновление сложнее."
    reference_answer: >
      Денормализация (часто через embedding) кладёт связанные данные в один
      документ — чтение за одно обращение без JOIN. Цена: дублирование и более
      сложные обновления (правка в нескольких местах).

  - type: true_false
    text: "Без подходящего индекса MongoDB выполняет полное сканирование коллекции (collection scan)."
    correct: true
    reference_answer: >
      Да, как и в SQL: без индекса идёт collection scan. Индексы ускоряют
      выборку/сортировку, но замедляют запись и занимают память.
