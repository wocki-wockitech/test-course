id: 518c32c6-03f3-491d-bf27-f12285820c4d
difficulty: 3
tags: [mongodb, replication, sharding, scaling]

variants:
  - type: multiple_choice
    text: "Чем репликасет (replica set) отличается от шардирования (sharding) в MongoDB?"
    options:
      - text: "Репликасет — копии одних данных для отказоустойчивости; шардирование — разбиение данных по серверам для масштабирования"
        correct: true
        feedback: "Верно. Реплика — про надёжность, шардинг — про горизонтальный рост объёма/нагрузки."
      - text: "Это синонимы, разницы нет"
        feedback: "Нет: репликация дублирует данные, шардинг делит их на части."
      - text: "Репликасет делит данные по shard key, шардинг хранит копии"
        feedback: "Перепутано: по shard key делит именно шардирование."
      - text: "Шардирование работает только на одном сервере"
        feedback: "Наоборот: шардинг разносит данные по нескольким серверам."
    reference_answer: >
      Replica set — это набор узлов с одинаковыми данными (primary + secondary)
      для отказоустойчивости. Sharding — горизонтальное разбиение данных по
      шардам по shard key для масштабирования объёма и нагрузки. Их часто
      сочетают: каждый шард сам является репликасетом.

  - type: multiple_choice
    text: "Что произойдёт в replica set при падении primary-узла?"
    options:
      - text: "Secondary проведут выборы и назначат новый primary"
        correct: true
        feedback: "Верно. Это автоматический failover через выборы."
      - text: "Кластер навсегда останется без приёма записей"
        feedback: "Нет, проводятся выборы нового primary."
      - text: "Данные будут безвозвратно потеряны"
        feedback: "Нет, данные реплицированы на secondary."
      - text: "Все узлы одновременно станут primary"
        feedback: "Primary всегда один; одновременно несколько быть не может."
    reference_answer: >
      При падении primary secondary-узлы проводят выборы и выбирают новый
      primary — автоматический failover. Записи принимает только primary.

  - type: true_false
    text: "Неудачно выбранный shard key может привести к неравномерной нагрузке и появлению «горячего» шарда."
    correct: true
    reference_answer: >
      Да. Если shard key распределяет данные неравномерно, один шард получает
      непропорционально много данных/запросов — это горячий шард.
