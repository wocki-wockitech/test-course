id: 10ceb2c9-5f4c-4326-a622-df6c84d44e94
difficulty: 2
tags: [mongodb, nosql, document-model]

variants:
  - type: multiple_choice
    text: "Как в MongoDB называется единица хранения и где она лежит?"
    options:
      - text: "Документ (BSON) внутри коллекции"
        correct: true
        feedback: "Верно. Документы хранятся в коллекциях, схема гибкая."
      - text: "Строка внутри таблицы со строгой схемой"
        feedback: "Это реляционная модель, не MongoDB."
      - text: "Ключ-значение внутри keyspace"
        feedback: "Это про key-value сторы вроде Redis/Cassandra."
      - text: "Узел и связь внутри графа"
        feedback: "Это графовые БД (Neo4j), не документная модель."
    reference_answer: >
      В MongoDB единица — документ (JSON-подобный, физически BSON), документы
      лежат в коллекциях. Документ может содержать вложенные объекты и массивы,
      схема гибкая.

  - type: true_false
    text: "В одной коллекции MongoDB документы могут иметь разный набор полей."
    correct: true
    reference_answer: >
      Да, схема гибкая (schema-flexible). Жёсткой структуры на уровне коллекции
      нет, хотя модель данных всё равно проектируют под паттерны доступа.
