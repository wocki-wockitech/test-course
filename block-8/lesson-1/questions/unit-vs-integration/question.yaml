id: 3c6385ba-201c-47fa-8e8e-64172907e749
difficulty: 2
tags: [testing, unit, integration, categorize]

variants:
  - type: categorize
    text: "Раздели проверки по типу теста, к которому они относятся:"
    categories:
      - name: "Unit-тест"
        items:
          - "Расчёт скидки в чистой функции без внешних зависимостей"
          - "Валидация email через регулярное выражение"
          - "Логика выбора стратегии оплаты на стабах"
      - name: "Integration-тест"
        items:
          - "Сохранение заказа в реальную PostgreSQL"
          - "Публикация сообщения в реальный Kafka и его вычитка"
          - "HTTP-вызов одного сервиса в другой"
    distractors:
      - "Прогон сценария покупки через браузер целиком"

  - type: true_false
    text: "Unit-тест не должен ходить в реальную базу данных, сеть или файловую систему."
    correct: true
    reference_answer: >
      Верно. Unit-тест изолирован: внешние зависимости подменяются двойниками,
      поэтому он быстрый и детерминированный. Работа с реальной БД — это уже
      integration-тест.
