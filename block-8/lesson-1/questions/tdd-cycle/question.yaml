id: 60d9ba62-f660-49ce-a6f1-872177ad926f
difficulty: 2
tags: [testing, tdd, aaa, ordering]

variants:
  - type: ordering
    text: "Расположи этапы цикла TDD по порядку:"
    items:
      - "Red — написать падающий тест на новое поведение"
      - "Green — написать минимальный код, чтобы тест прошёл"
      - "Refactor — почистить код, оставив тесты зелёными"

  - type: ordering
    text: "Расположи шаги теста по структуре AAA:"
    items:
      - "Arrange — подготовить данные и зависимости"
      - "Act — выполнить проверяемое действие"
      - "Assert — проверить результат"

  - type: multiple_choice
    text: "В чём основная идея TDD?"
    options:
      - text: "Сначала пишем тест, потом минимальный код, который его проходит, затем рефакторим"
        correct: true
        feedback: "Верно. Цикл red — green — refactor, тест ведёт за собой реализацию."
      - text: "Пишем все тесты в самом конце, после релиза"
        feedback: "Нет, в TDD тест пишется до кода."
      - text: "Пишем код без тестов, а тесты — только если найдётся баг"
        feedback: "Это не TDD: в TDD тест предшествует коду."
      - text: "TDD — это про ручное тестирование QA-командой"
        feedback: "Нет, TDD — практика разработчика по написанию авто-тестов до кода."
    reference_answer: >
      TDD: пишем падающий тест (red), минимальный код для прохождения (green),
      затем рефакторим при зелёных тестах. Это заставляет думать о контракте
      до реализации.
