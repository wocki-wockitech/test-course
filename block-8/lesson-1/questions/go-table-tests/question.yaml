id: ""
difficulty: 2
tags: [testing, go, table-tests]

variants:
  - type: multiple_choice
    text: "Что за приём тестирования использован в файле и зачем `t.Run`?"
    file: main_test.go
    options:
      - text: "Табличный тест: набор кейсов в срезе структур, `t.Run` запускает каждый как именованный подтест"
        correct: true
        feedback: "Верно. Так меньше дублирования, а подтесты дают понятные имена и независимый прогон/фильтрацию."
      - text: "Это бенчмарк, `t.Run` измеряет время"
        feedback: "Нет, бенчмарки используют `testing.B` и `b.N`, а здесь обычный тест `testing.T`."
      - text: "`t.Run` запускает все кейсы параллельно по умолчанию"
        feedback: "Нет, параллельность включается явным `t.Parallel()` внутри подтеста."
      - text: "Это fuzz-тест со случайными входами"
        feedback: "Нет, входы заданы явной таблицей, ничего случайного тут нет."
    reference_answer: >
      Это табличный тест: кейсы лежат в срезе анонимных структур, цикл прогоняет
      их, а `t.Run` оформляет каждый как именованный подтест. Удобно добавлять
      новые случаи и видеть, какой именно упал.

  - type: true_false
    text: "В табличном тесте на Go из файла, чтобы добавить новый случай, обычно достаточно добавить одну строку в таблицу кейсов."
    file: main_test.go
    correct: true
    reference_answer: >
      Да. В этом и плюс табличных тестов: логика проверки общая, новый кейс —
      это ещё один элемент среза.
