id: ""
difficulty: 3
tags: [testing, mocks, stubs, fakes]

variants:
  - type: multiple_choice
    text: "Чем mock отличается от stub?"
    options:
      - text: "Mock проверяет факт и характер вызовов, stub лишь отдаёт заданные ответы"
        correct: true
        feedback: "Верно. Mock проверяет поведение (взаимодействие), stub — это источник заранее заданных данных."
      - text: "Stub проверяет вызовы, mock только отдаёт данные"
        feedback: "Наоборот: проверкой взаимодействия занимается mock."
      - text: "Это одно и то же"
        feedback: "Нет, разница в том, проверяет ли двойник взаимодействие."
      - text: "Mock — это всегда реальная база данных"
        feedback: "Нет, реальная упрощённая реализация — это fake, а не mock."
    reference_answer: >
      Stub возвращает заранее заданные ответы (проверка состояния). Mock — стаб
      плюс проверка взаимодействия: тест падает, если ожидаемый вызов не
      случился или прошёл не так.

  - type: matching
    text: "Сопоставь тестовый двойник с его сутью:"
    pairs:
      - left: "Stub"
        right: "Отдаёт заранее заданные ответы"
      - left: "Mock"
        right: "Проверяет, что нужные вызовы произошли"
      - left: "Fake"
        right: "Упрощённая рабочая реализация (например, in-memory)"
    distractors:
      - "Запускает систему целиком как пользователь"

  - type: true_false
    text: "Чрезмерное количество моков делает тесты хрупкими, потому что они начинают проверять реализацию, а не результат."
    correct: true
    reference_answer: >
      Да. Если можно проверить итоговое состояние стабом, обычно это надёжнее,
      чем мокать каждый вызов.
