id: 93a3698c-c7b3-454c-88b0-32c01e66825e
difficulty: 2
tags: [testing, pyramid, strategy]

variants:
  - type: multiple_choice
    text: "Что описывает пирамида тестов?"
    options:
      - text: "Много быстрых unit-тестов, меньше integration, совсем мало e2e"
        correct: true
        feedback: "Верно. Чем выше уровень — тем медленнее и хрупче тест, поэтому их меньше."
      - text: "Поровну тестов каждого уровня"
        feedback: "Нет, смысл пирамиды как раз в разном количестве по уровням."
      - text: "Много e2e сверху и мало unit снизу"
        feedback: "Это антипаттерн — перевёрнутая пирамида (“стакан с мороженым”)."
      - text: "Только e2e-тесты, остальное не нужно"
        feedback: "Нет, e2e медленные и хрупкие, их держат минимум."
    reference_answer: >
      Пирамида: основание — много быстрых изолированных unit-тестов, середина —
      меньше интеграционных, вершина — мало медленных e2e. Чем выше, тем дороже
      и хрупче.

  - type: matching
    text: "Сопоставь уровень теста с тем, что он обязательно проверяет:"
    pairs:
      - left: "Unit"
        right: "Одну единицу кода в изоляции, без внешних зависимостей"
      - left: "Integration"
        right: "Совместную работу компонентов с реальной зависимостью (БД, сеть)"
      - left: "E2E"
        right: "Систему целиком, сценарий как у пользователя"

  - type: true_false
    text: "Перевёрнутая пирамида (много e2e, мало unit) считается антипаттерном."
    correct: true
    reference_answer: >
      Да. Опора на медленные и хрупкие e2e делает набор тестов медленным и
      ненадёжным. Базу должны составлять быстрые unit-тесты.
