id: f822d13d-3bc6-4a40-9ccf-f3c99ab8922e
difficulty: 3
tags: [testing, coverage, flaky]

questions:
  - type: multiple_choice
    text: "Почему 100% покрытие кода тестами не гарантирует отсутствие багов?"
    options:
      - text: "Строка может выполниться без единого ассерта, проверяющего результат"
        correct: true
        feedback: "Верно. Coverage показывает, что код выполнился, но не что поведение действительно проверено."
      - text: "Покрытие 100% действительно гарантирует отсутствие багов"
        feedback: "Нет. Выполнение строки и проверка её корректности — разные вещи."
      - text: "Потому что покрытие измеряет только скорость тестов"
        feedback: "Нет, покрытие — про выполненные строки/ветки, а не про скорость."
      - text: "Потому что coverage работает только для unit-тестов"
        feedback: "Нет, его можно собирать и на интеграционных прогонах."
    reference_answer: >
      Покрытие показывает, какие строки/ветки выполнились, но не проверяет их
      корректность: можно прогнать код без осмысленных ассертов. Это индикатор
      непокрытых мест, а не гарантия качества.

  - type: true_false
    text: "Флаки-тест (flaky) — это тест, который то проходит, то падает без изменений в коде."
    correct: true
    reference_answer: >
      Да. Частые причины — зависимость от времени, сети, порядка выполнения,
      общего состояния или гонок. Флаки подрывают доверие к тестам, их чинят
      или карантинят, а не игнорируют.

  - type: multiple_choice
    text: "Что из перечисленного обычно НЕ стоит покрывать тестами?"
    options:
      - text: "Тривиальные геттеры/сеттеры и код чужого фреймворка"
        correct: true
        feedback: "Верно. Тестируем своё наблюдаемое поведение и бизнес-логику, а не язык и фреймворк."
      - text: "Бизнес-логику и граничные случаи"
        feedback: "Наоборот, это первое, что нужно покрывать."
      - text: "Обработку ошибок"
        feedback: "Её как раз важно проверять."
      - text: "Найденный баг (регрессионный тест)"
        feedback: "На баг полезно написать тест, чтобы он не вернулся."
    reference_answer: >
      Не стоит тестировать тривиальные геттеры/сеттеры, язык и чужой фреймворк.
      Фокус — на бизнес-логике, граничных случаях, ошибках и регрессах.
