id: ""
difficulty: 3
tags: [performance, optimization, database]

variants:
  - type: ordering
    text: "Расположи шаги правильной оптимизации производительности по порядку:"
    items:
      - "Измерь — собери метрики и профиль, не угадывай"
      - "Найди узкое место (bottleneck)"
      - "Оптимизируй именно его"
      - "Перепроверь — измерь снова и убедись, что стало лучше"

  - type: multiple_choice
    text: "С чего нужно начинать оптимизацию производительности?"
    options:
      - text: "Измерить и профилировать, чтобы найти реальное узкое место"
        correct: true
        feedback: "Верно. Сначала замер: оптимизация без профиля часто бьёт мимо настоящего тормоза."
      - text: "Сразу переписать самый сложный на вид код"
        feedback: "Нет, “на вид сложный” не значит “медленный”. Нужен замер."
      - text: "Добавить кеш везде на всякий случай"
        feedback: "Нет, это создаёт проблему инвалидации и не факт, что решает узкое место."
      - text: "Купить более мощный сервер"
        feedback: "Это не первый шаг: сначала найти, где реально теряется время."
    reference_answer: >
      Сначала измерь и профилируй (pprof, Xdebug/Blackfire, EXPLAIN), найди
      узкое место, оптимизируй именно его и перепроверь замером. Не угадывай.

  - type: multiple_choice
    text: "Что такое проблема N+1 и как её обычно решают?"
    options:
      - text: "Вместо одного запроса выполняется 1 + N запросов в цикле; лечится join/предзагрузкой (eager loading) или батчингом"
        correct: true
        feedback: "Верно. Классический тормоз при работе с БД/ORM: лишние запросы по одному на каждую сущность."
      - text: "Это когда в таблице на одну строку больше, чем нужно"
        feedback: "Нет, N+1 — про количество запросов, а не строк."
      - text: "Это ошибка off-by-one в индексе массива"
        feedback: "Нет, это про запросы к БД в цикле, а не про индексацию массива."
      - text: "Это лишний +1 к счётчику в Redis"
        feedback: "Нет, N+1 — про паттерн избыточных запросов к данным."
    reference_answer: >
      N+1: один запрос за списком и ещё по запросу на каждый элемент (1 + N).
      Решается join'ом, предзагрузкой связанных данных (eager loading) или
      батчингом запросов.
