id: 1f4da79b-f211-4d65-ac49-9bc85b5c76e8
difficulty: 2
tags: [process, agile, scrum]

variants:
  - type: matching
    text: "Сопоставь роль в Scrum с её обязанностью:"
    pairs:
      - left: "Product Owner"
        right: "Владеет бэклогом и приоритетами, решает “что и зачем”"
      - left: "Scrum Master"
        right: "Помогает процессу, убирает препятствия, фасилитирует церемонии"
      - left: "Команда разработки"
        right: "Кросс-функционально решает “как” и оценивает объём работы"

  - type: multiple_choice
    text: "Кто отвечает за приоритеты и содержимое product backlog в Scrum?"
    options:
      - text: "Product Owner"
        correct: true
        feedback: "Верно. PO владеет бэклогом и определяет приоритеты, отвечая за ценность продукта."
      - text: "Scrum Master"
        feedback: "Нет, SM помогает процессу и убирает препятствия, а не владеет приоритетами."
      - text: "Команда разработки"
        feedback: "Команда решает “как” и оценивает, но приоритеты — за PO."
      - text: "Стейкхолдеры напрямую"
        feedback: "Стейкхолдеры влияют через PO, но владелец бэклога — PO."
    reference_answer: >
      Product Owner владеет product backlog и его приоритетами, отвечает за
      ценность продукта и решает, что и зачем делать.

  - type: true_false
    text: "Scrum Master — это начальник команды, который раздаёт задачи и контролирует исполнителей."
    correct: false
    reference_answer: >
      Нет. Scrum Master не начальник: он фасилитирует процесс, помогает команде
      и убирает препятствия. Команда самоорганизуется и сама решает “как”.
