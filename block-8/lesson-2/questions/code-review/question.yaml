id: ""
difficulty: 2
tags: [process, code-review]

variants:
  - type: multiple_choice
    text: "Какова основная цель code review?"
    options:
      - text: "Повысить качество кода и распространить знания по команде через раннее выявление проблем"
        correct: true
        feedback: "Верно. Ревью — про корректность, читаемость, общее владение кодом и единый стиль, а не про придирки."
      - text: "Найти виноватого, если что-то сломается"
        feedback: "Нет, ревью — не про поиск виноватых, а про качество и обмен знаниями."
      - text: "Замедлить разработку формальной процедурой"
        feedback: "Нет, цель обратная — ловить проблемы рано, когда чинить дешевле."
      - text: "Проверить только форматирование кода"
        feedback: "Форматирование — мелочь, его лучше отдать линтеру; ревью смотрит шире."
    reference_answer: >
      Code review повышает качество (корректность, читаемость, тесты,
      безопасность, производительность) и распространяет знания по команде.
      Найти проблему на ревью дешевле, чем на проде.

  - type: multiple_choice
    text: "Что из перечисленного НЕ является основной задачей ревьюера?"
    options:
      - text: "Спорить о вкусовом форматировании, которое уже проверяет линтер"
        correct: true
        feedback: "Верно. Стиль лучше автоматизировать линтером/форматтером; ревью — про суть."
      - text: "Проверить корректность и граничные случаи"
        feedback: "Это как раз важная часть ревью."
      - text: "Убедиться, что есть осмысленные тесты"
        feedback: "Это входит в задачи ревьюера."
      - text: "Заметить риски безопасности и производительности (например, N+1)"
        feedback: "Это важная часть ревью."
    reference_answer: >
      Вкусовое форматирование стоит отдать линтеру. Ревьюер фокусируется на
      корректности, читаемости, тестах, безопасности и производительности.
