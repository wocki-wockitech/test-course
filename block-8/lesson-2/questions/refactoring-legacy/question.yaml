id: 6c5f87ff-de60-46f7-84fc-0b74e9678124
difficulty: 3
tags: [refactoring, legacy, testing]

variants:
  - type: multiple_choice
    text: "С чего безопаснее всего начать рефакторинг legacy-кода без тестов?"
    options:
      - text: "Покрыть его характеризующими тестами, фиксирующими текущее поведение"
        correct: true
        feedback: "Верно. Characterization tests — страховочная сеть: они закрепляют поведение “как есть”, чтобы заметить регресс."
      - text: "Сразу переписать всё с нуля одним большим коммитом"
        feedback: "Рискованно: без тестов легко изменить поведение и не заметить."
      - text: "Добавить новые фичи прямо в процессе рефакторинга"
        feedback: "Нет, рефакторинг и новые фичи смешивать нельзя — непонятно, что сломало поведение."
      - text: "Удалить непонятный код, раз он непонятный"
        feedback: "Опасно: непонятный код может нести нужное поведение."
    reference_answer: >
      Сначала покрыть характеризующими тестами (фиксируют текущее поведение),
      затем рефакторить маленькими шагами, прогоняя тесты после каждого, не
      меняя внешнее поведение.

  - type: ordering
    text: "Расположи шаги безопасного рефакторинга legacy по порядку:"
    items:
      - "Покрыть код характеризующими тестами"
      - "Сделать маленькое изменение структуры"
      - "Прогнать тесты и убедиться, что поведение не изменилось"
      - "Повторять маленькими шагами до цели"

  - type: true_false
    text: "Рефакторинг по определению не должен менять внешнее наблюдаемое поведение кода."
    correct: true
    reference_answer: >
      Да. Рефакторинг улучшает внутреннюю структуру, сохраняя поведение.
      Изменение поведения — это уже новая функциональность или багфикс.
