id: a8ec5a2a-d0d1-4a84-9006-f6ae32a3898e
difficulty: 2
tags: [refactoring, code-smells]

variants:
  - type: multiple_choice
    text: "Что такое “code smell”?"
    options:
      - text: "Признак того, что код стоит отрефакторить, хотя сам по себе это ещё не баг"
        correct: true
        feedback: "Верно. Запах указывает на возможную проблему дизайна, а не на ошибку выполнения."
      - text: "Синтаксическая ошибка, из-за которой код не компилируется"
        feedback: "Нет, это ошибка компиляции, а не запах."
      - text: "Уязвимость безопасности"
        feedback: "Не обязательно: запах — про сопровождаемость, а не про безопасность."
      - text: "Падающий тест"
        feedback: "Нет, падающий тест — это сигнал бага, а не code smell."
    reference_answer: >
      Code smell — симптом проблемного дизайна (дублирование, длинный метод,
      большой класс и т.д.). Это не баг, а повод задуматься о рефакторинге.

  - type: categorize
    text: "Раздели понятия: что является code smell, а что нет:"
    categories:
      - name: "Code smell"
        items:
          - "Длинный метод с десятками строк"
          - "Дублирование кода (copy-paste)"
          - "Длинный список параметров"
          - "Магические числа без имени"
      - name: "Не code smell"
        items:
          - "Падение теста из-за реального бага"
          - "Ошибка компиляции"
    distractors:
      - "Сетевой таймаут в проде"
