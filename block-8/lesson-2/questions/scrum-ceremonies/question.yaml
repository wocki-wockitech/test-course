id: ""
difficulty: 2
tags: [process, agile, scrum, ceremonies]

variants:
  - type: matching
    text: "Сопоставь Scrum-церемонию с её целью:"
    pairs:
      - left: "Sprint Planning"
        right: "Решить, что берём в спринт и как это сделаем"
      - left: "Daily"
        right: "Короткая синхронизация команды, фокус на препятствиях"
      - left: "Sprint Review"
        right: "Показать инкремент стейкхолдерам и собрать обратную связь"
      - left: "Retrospective"
        right: "Обсудить, как улучшить сам процесс работы команды"

  - type: multiple_choice
    text: "В чём цель ретроспективы (retrospective)?"
    options:
      - text: "Улучшить процесс работы команды: что хорошо, что мешало, что изменить"
        correct: true
        feedback: "Верно. Retro — про процесс, а не про продукт; review — наоборот про продукт."
      - text: "Показать готовый инкремент заказчику"
        feedback: "Это Sprint Review, а не retro."
      - text: "Распределить задачи на спринт"
        feedback: "Это Planning."
      - text: "Отчитаться руководителю о потраченных часах"
        feedback: "Retro — командная рефлексия, а не отчёт по часам."
    reference_answer: >
      Retrospective направлена на улучшение процесса: команда обсуждает, что
      шло хорошо, что мешало и какие изменения внести в следующий спринт.

  - type: true_false
    text: "Daily-встреча предназначена для отчёта перед руководителем, а не для синхронизации команды."
    correct: false
    reference_answer: >
      Нет. Daily — это синхронизация команды (что сделал, что буду делать, что
      мешает) с фокусом на препятствиях, а не отчёт начальнику.
