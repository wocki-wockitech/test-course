id: ecf0cabf-32c7-4a73-85b2-3e9faa47c6fe
difficulty: 3
tags: [docker, images, layers]

questions:
  - type: multiple_choice
    text: "Что такое слой (layer) образа Docker?"
    options:
      - text: "Дельта изменений файловой системы; слои read-only складываются, а контейнер добавляет сверху writable-слой"
        correct: true
        feedback: "Верно. Слои переиспользуются и кешируются между образами."
      - text: "Отдельный запущенный контейнер"
        feedback: "Нет, слой — часть образа, а не запущенный контейнер."
      - text: "Сетевой интерфейс контейнера"
        feedback: "Нет, это про сети, а не про образы."
      - text: "Файл логов контейнера"
        feedback: "Нет, слой — это часть файловой системы образа."
    reference_answer: >
      Образ состоит из read-only слоёв (дельт ФС), сложенных через union
      filesystem. При запуске сверху добавляется тонкий writable-слой,
      который исчезает с удалением контейнера. Слои кешируются и общие
      базовые слои хранятся один раз.

  - type: true_false
    text: "Данные, записанные в writable-слой контейнера, по умолчанию исчезают при удалении контейнера."
    correct: true
    reference_answer: >
      Да. Writable-слой эфемерный. Чтобы данные пережили контейнер, нужны
      volumes.
