id: ""
difficulty: 4
tags: [docker, dockerfile, best-practices, multi-stage, cache]

variants:
  - type: multiple_choice
    text: "Сравни два Dockerfile в файле. Что верно про вариант B относительно A?"
    file: Dockerfile
    options:
      - text: "B лучше: multi-stage даёт маленький финальный образ без тулчейна, запуск не от root, а порядок COPY go.mod до COPY . . бережёт кеш"
        correct: true
        feedback: "Верно. A тащит компилятор в прод, работает от root и ломает кеш через COPY . . до go mod download."
      - text: "A лучше, потому что в нём меньше строк"
        feedback: "Меньше строк не значит лучше: A раздут, небезопасен и плохо кеширует."
      - text: "Оба эквивалентны по размеру финального образа"
        feedback: "Нет: A основан на golang:1.22 целиком, B — на alpine только с бинарём."
      - text: "B хуже, потому что запускается не от root"
        feedback: "Наоборот, запуск не от root — это плюс к безопасности."
    reference_answer: >
      В варианте A: образ основан на полном golang (компилятор и исходники
      едут в прод), процесс работает от root, а COPY . . идёт до go mod
      download — любая правка кода инвалидирует кеш зависимостей. Вариант B
      использует multi-stage (в финал едет только бинарь на alpine),
      создаёт непривилегированного пользователя и копирует go.mod/go.sum до
      кода, сохраняя кеш установки зависимостей.

  - type: multiple_choice
    text: "Почему в варианте A ломается кеш установки зависимостей при каждой правке кода?"
    file: Dockerfile
    options:
      - text: "Потому что COPY . . идёт до go mod download — изменение любого файла инвалидирует слой и всё, что ниже"
        correct: true
        feedback: "Верно. Манифест зависимостей нужно копировать отдельно и раньше остального кода."
      - text: "Потому что используется WORKDIR"
        feedback: "WORKDIR тут ни при чём, он не инвалидирует кеш кода."
      - text: "Потому что базовый образ слишком маленький"
        feedback: "Наоборот, базовый образ A большой; дело в порядке инструкций."
      - text: "Потому что нет инструкции EXPOSE"
        feedback: "EXPOSE не влияет на кеш слоёв."
    reference_answer: >
      COPY . . попадает в слой выше go mod download. Любое изменение в коде
      меняет этот слой, поэтому Docker пересобирает все следующие слои,
      включая установку зависимостей. Решение — копировать go.mod/go.sum и
      ставить зависимости до COPY . . (как в варианте B).
