id: ""
difficulty: 2
tags: [docker, dockerfile, instructions]

variants:
  - type: matching
    text: "Сопоставь инструкцию Dockerfile с её назначением:"
    pairs:
      - left: "FROM"
        right: "Задаёт базовый образ"
      - left: "RUN"
        right: "Выполняет команду на этапе сборки и создаёт слой"
      - left: "COPY"
        right: "Копирует файлы из контекста сборки в образ"
      - left: "CMD"
        right: "Команда по умолчанию при запуске контейнера"
      - left: "WORKDIR"
        right: "Устанавливает рабочую директорию"
    distractors:
      - "Публикует порт в интернет"

  - type: multiple_choice
    text: "Когда выполняется инструкция `RUN`?"
    options:
      - text: "Во время сборки образа (docker build), результат сохраняется в слой"
        correct: true
        feedback: "Верно. RUN — это build-time, в отличие от CMD/ENTRYPOINT."
      - text: "Каждый раз при запуске контейнера"
        feedback: "Нет, это про CMD/ENTRYPOINT. RUN — на этапе сборки."
      - text: "Только при удалении контейнера"
        feedback: "Нет такого этапа для RUN."
      - text: "При публикации образа в registry"
        feedback: "Нет, push не выполняет инструкции образа."
    reference_answer: >
      RUN выполняется на этапе сборки и фиксирует результат в новый слой
      образа. CMD/ENTRYPOINT, наоборот, выполняются при запуске контейнера.
