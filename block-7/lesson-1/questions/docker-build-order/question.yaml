id: c4990629-8b75-4309-aca9-d72af242933d
difficulty: 3
tags: [docker, dockerfile, cache, build]

variants:
  - type: ordering
    text: "Расположи инструкции Dockerfile в порядке, который лучше всего использует кеш слоёв (редко меняющееся — раньше):"
    items:
      - "FROM базовый образ"
      - "WORKDIR /app"
      - "COPY composer.json (манифест зависимостей)"
      - "RUN composer install (установка зависимостей)"
      - "COPY . . (исходный код)"
      - "CMD запуск приложения"

  - type: true_false
    text: "Изменение одного слоя инвалидирует кеш этого слоя и всех слоёв после него."
    correct: true
    reference_answer: >
      Да. Кеш берётся, пока не изменился слой и ничего выше него. Поэтому
      редко меняющиеся шаги (установка зависимостей) ставят до копирования
      кода.
