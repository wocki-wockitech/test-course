id: 071fbe41-1e2b-4397-8318-fbeda77d7019
difficulty: 2
tags: [docker, containers, vm, basics]

variants:
  - type: multiple_choice
    text: "Чем контейнер принципиально отличается от виртуальной машины?"
    options:
      - text: "Контейнер использует ядро хоста и изолируется через namespaces/cgroups, а VM запускает свою гостевую ОС с отдельным ядром"
        correct: true
        feedback: "Верно. Поэтому контейнеры легче и стартуют быстрее, но привязаны к ядру хоста."
      - text: "Контейнер запускает полноценную гостевую ОС, а VM — нет"
        feedback: "Наоборот: своя гостевая ОС с ядром — это про VM."
      - text: "Разницы нет, это синонимы"
        feedback: "Нет, модель изоляции и вес принципиально разные."
      - text: "Контейнер всегда медленнее виртуалки"
        feedback: "Обычно наоборот — старт за доли секунды против секунд/минут у VM."
    reference_answer: >
      VM виртуализирует железо и тащит отдельное ядро и гостевую ОС.
      Контейнер виртуализирует ОС: делит ядро хоста, изолируется через
      namespaces и cgroups. Отсюда лёгкость и быстрый старт.

  - type: true_false
    text: "Все контейнеры на одном хосте Linux делят общее ядро операционной системы."
    correct: true
    reference_answer: >
      Да. Контейнеры не запускают своё ядро — изоляция строится поверх ядра
      хоста через namespaces и cgroups.
