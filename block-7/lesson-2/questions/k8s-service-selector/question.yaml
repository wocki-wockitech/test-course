id: ""
difficulty: 3
tags: [kubernetes, service, labels, selector]

variants:
  - type: multiple_choice
    text: "Как Service определяет, на какие поды направлять трафик?"
    options:
      - text: "По label selector — выбирает поды, чьи лейблы совпадают с selector сервиса"
        correct: true
        feedback: "Верно. Связь держится на лейблах, а не на IP подов."
      - text: "По жёстко прописанным IP-адресам подов"
        feedback: "Нет, IP подов меняются; связь по лейблам."
      - text: "По имени контейнера в образе"
        feedback: "Нет, имя контейнера не используется для маршрутизации Service."
      - text: "По порядку создания подов"
        feedback: "Нет, порядок создания не влияет на выбор бэкендов."
    reference_answer: >
      Service матчит поды по label selector. Поды приходят и уходят, а
      Service автоматически обновляет список эндпоинтов по совпадению
      лейблов.

  - type: true_false
    text: "Если у пода нет лейблов, совпадающих с selector сервиса, трафик от этого Service на под не пойдёт."
    correct: true
    reference_answer: >
      Да. Service выбирает бэкенды только по совпадению лейблов с selector.
