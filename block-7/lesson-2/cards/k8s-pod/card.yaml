id: 52861aeb-08a4-4d9e-b9fd-93cc923eba42
difficulty: 2
tags: [kubernetes, pod, networking]

questions:
  - type: multiple_choice
    text: "Что такое Pod в Kubernetes?"
    options:
      - text: "Минимальная единица развёртывания: один или несколько контейнеров с общими сетью и storage"
        correct: true
        feedback: "Верно. Контейнеры в поде делят один IP и localhost."
      - text: "Физический сервер (нода) кластера"
        feedback: "Нет, это Node. Pod запускается на ноде."
      - text: "Балансировщик нагрузки"
        feedback: "Нет, балансировка — это про Service/Ingress."
      - text: "Образ контейнера"
        feedback: "Нет, образ — шаблон, Pod — запущенная единица."
    reference_answer: >
      Pod — наименьшая разворачиваемая единица: обычно один контейнер, иногда
      несколько тесно связанных, с общими сетевым пространством (один IP) и
      томами.

  - type: true_false
    text: "Поды эфемерны: при пересоздании под обычно получает новый IP, поэтому к подам не обращаются напрямую по IP."
    correct: true
    reference_answer: >
      Да. IP пода непостоянен, поэтому для доступа используют Service со
      стабильным адресом.
