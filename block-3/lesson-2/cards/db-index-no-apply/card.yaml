id: 8cdb3e18-235c-4266-982c-da7d31cbcd2d
difficulty: 4
tags: [db, indexes, optimization, sql]

questions:
  - type: multiple_choice
    text: "Посмотри запросы в файле. В каком случае индекс `idx_users_email` применится для поиска?"
    file: query.sql
    options:
      - text: "Только в запросе B (`email = 'a@b.c'`)"
        correct: true
        feedback: "Верно. В A функция LOWER() над колонкой убивает индекс, в C leading wildcard LIKE '%ivan' — и тоже другая колонка name."
      - text: "Во всех трёх запросах"
        feedback: "Нет: функция над колонкой и leading wildcard не дают использовать B-tree."
      - text: "Только в запросе A"
        feedback: "Наоборот — LOWER(email) не использует индекс по email."
      - text: "Только в запросе C"
        feedback: "LIKE '%ivan' с ведущим % не использует B-tree, и колонка там другая."
    reference_answer: >
      Индекс по email применится только при прямом сравнении (B). В A функция
      LOWER(email) над колонкой делает индекс непригодным — нужен функциональный
      индекс. В C ведущий wildcard LIKE '%ivan' не позволяет искать по префиксу.

  - type: true_false
    text: "Запрос `WHERE name LIKE 'ivan%'` (без ведущего `%`) может использовать B-tree индекс по `name`."
    correct: true
    reference_answer: >
      При известном префиксе B-tree спускается к диапазону значений. Проблему
      создаёт только ведущий wildcard `'%ivan'`.
