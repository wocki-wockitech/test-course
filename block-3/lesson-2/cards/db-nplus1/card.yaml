id: 7312b565-c66c-4e64-a0e5-435eb46e2c52
difficulty: 3
tags: [db, orm, n-plus-1, optimization]

questions:
  - type: multiple_choice
    text: "Что такое проблема N+1 запросов?"
    options:
      - text: "Вместо одного запроса делается 1 запрос на список + по запросу на каждую запись"
        correct: true
        feedback: "Верно. Это про число round-trip к БД, типичная беда ORM при ленивой загрузке."
      - text: "Когда в таблице на 1 строку больше, чем нужно"
        feedback: "Нет, N+1 — про количество запросов, а не строк."
      - text: "Когда индекс занимает на 1 уровень больше в B-tree"
        feedback: "Это не имеет отношения к N+1."
      - text: "Когда транзакция повторяется N+1 раз из-за deadlock"
        feedback: "Нет, это про ретраи, а не N+1."
    reference_answer: >
      N+1 — это 1 запрос за список и ещё N запросов на каждую связанную запись.
      Лечится eager-загрузкой: JOIN, IN (...), батчинг.

  - type: true_false
    text: "Проблему N+1 можно решить eager-загрузкой связей через JOIN или `IN (...)`."
    correct: true
    reference_answer: >
      Eager-загрузка собирает связанные данные за один-два запроса вместо N,
      убирая лишние round-trip к БД.
