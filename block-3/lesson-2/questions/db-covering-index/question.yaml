id: 31351201-f8ea-438f-818f-460e6066e07e
difficulty: 3
tags: [db, indexes, covering]

variants:
  - type: multiple_choice
    text: "Что такое покрывающий индекс (covering index)?"
    options:
      - text: "Индекс, содержащий все нужные запросу колонки, поэтому ответ берётся из индекса без обращения к таблице"
        correct: true
        feedback: "Верно. Это index-only scan — не нужно ходить в heap за строкой."
      - text: "Индекс, который покрывает все колонки таблицы"
        feedback: "Не обязательно все колонки таблицы — только нужные конкретному запросу."
      - text: "Индекс, который автоматически создаётся под каждый запрос"
        feedback: "Нет, индексы так не создаются."
      - text: "Уникальный индекс по первичному ключу"
        feedback: "Это другое; PK-индекс не обязательно покрывающий для произвольного запроса."
    reference_answer: >
      Покрывающий индекс включает все колонки, которые читает запрос, поэтому
      БД делает index-only scan и не обращается к самой таблице.

  - type: true_false
    text: "В PostgreSQL в индекс можно добавить неключевые колонки через `INCLUDE`, чтобы сделать его покрывающим."
    correct: true
    reference_answer: >
      INCLUDE добавляет колонки в листья индекса без участия в сортировке —
      удобно для покрывающих индексов.
