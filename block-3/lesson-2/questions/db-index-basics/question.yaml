id: 00101cf6-f742-440c-892e-640e056cae4f
difficulty: 2
tags: [db, indexes, btree]

variants:
  - type: multiple_choice
    text: "Какая структура чаще всего используется для индекса в реляционных БД и почему?"
    options:
      - text: "B-tree — даёт поиск, диапазоны и сортировку за O(log n)"
        correct: true
        feedback: "Верно. B-tree упорядочен, поэтому хорош и для точечного поиска, и для диапазонов."
      - text: "Хеш-таблица — потому что это всегда быстрее B-tree"
        feedback: "Хеш-индекс хорош для точного равенства, но не для диапазонов и сортировки."
      - text: "Связанный список"
        feedback: "Поиск по списку — это O(n), не подходит для индекса."
      - text: "Очередь FIFO"
        feedback: "Это не структура для поиска по значению."
    reference_answer: >
      По умолчанию используется B-tree: сбалансированное упорядоченное дерево,
      хорошо обслуживает равенство, диапазоны и ORDER BY за O(log n).

  - type: true_false
    text: "Индекс ускоряет чтение, но замедляет операции записи (INSERT/UPDATE/DELETE)."
    correct: true
    reference_answer: >
      При записи индекс нужно поддерживать в актуальном состоянии, поэтому
      каждая модификация дороже, плюс индекс занимает место.
