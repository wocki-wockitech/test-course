id: ""
difficulty: 4
tags: [db, indexes, composite]

variants:
  - type: multiple_choice
    text: "Есть составной индекс `(a, b, c)`. Какой запрос НЕ сможет использовать его для индексного поиска?"
    options:
      - text: "`WHERE b = 2 AND c = 3` (без условия на a)"
        correct: true
        feedback: "Верно. Нет левого префикса (столбца a) — индекс для поиска не используется."
      - text: "`WHERE a = 1`"
        feedback: "Это левый префикс — индекс работает."
      - text: "`WHERE a = 1 AND b = 2`"
        feedback: "Это левый префикс из двух столбцов — работает."
      - text: "`WHERE a = 1 AND b = 2 AND c = 3`"
        feedback: "Полное совпадение префикса — работает."
    reference_answer: >
      Правило левого префикса: индекс (a, b, c) упорядочен сначала по a. Без
      условия на a поиск по индексу невозможен.

  - type: true_false
    text: "Порядок столбцов в составном индексе влияет на то, какие запросы его смогут использовать."
    correct: true
    reference_answer: >
      Да. Индекс (a, b) и (b, a) — разные. Используется левый префикс, поэтому
      порядок столбцов критичен.
