id: 6c90d8b4-0cfa-4420-a43f-0629319c11e7
difficulty: 3
tags: [db, postgresql, mysql]

questions:
  - type: multiple_choice
    text: "Какой уровень изоляции используется по умолчанию в MySQL/InnoDB?"
    options:
      - text: "Repeatable Read"
        correct: true
        feedback: "Верно. У InnoDB дефолт — Repeatable Read, у PostgreSQL — Read Committed."
      - text: "Read Committed"
        feedback: "Это дефолт PostgreSQL, а не MySQL."
      - text: "Read Uncommitted"
        feedback: "Нет, это самый слабый уровень и не дефолт."
      - text: "Serializable"
        feedback: "Слишком строгий для дефолта."
    reference_answer: >
      MySQL/InnoDB по умолчанию использует Repeatable Read, а PostgreSQL —
      Read Committed.

  - type: matching
    text: "Сопоставь СУБД с её характерной чертой:"
    pairs:
      - left: "PostgreSQL"
        right: "Версии строк в таблице, чистит VACUUM"
      - left: "MySQL/InnoDB"
        right: "Старые версии строк хранятся в undo-логе"
      - left: "PostgreSQL"
        right: "JSONB, массивы, функциональные индексы из коробки"
      - left: "MySQL"
        right: "Несколько движков хранения (InnoDB, MyISAM)"

  - type: true_false
    text: "В PostgreSQL для очистки мёртвых версий строк нужен VACUUM, а InnoDB хранит старые версии в undo-логе."
    correct: true
    reference_answer: >
      Это одно из ключевых отличий реализации MVCC: PostgreSQL держит версии в
      самой таблице и чистит их VACUUM, InnoDB — в undo-логе.
