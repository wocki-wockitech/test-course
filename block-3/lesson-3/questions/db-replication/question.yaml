id: e87fb498-351e-4e1a-8b19-b91ca491e8a1
difficulty: 3
tags: [db, replication, scaling]

variants:
  - type: multiple_choice
    text: "Чем асинхронная репликация отличается от синхронной?"
    options:
      - text: "При async master не ждёт реплику (быстро, но есть lag); при sync ждёт подтверждения (надёжно, но медленнее запись)"
        correct: true
        feedback: "Верно. Это обмен скорости записи на гарантию сохранности данных."
      - text: "Async копирует только схему, sync — только данные"
        feedback: "Нет, обе копируют изменения данных."
      - text: "Sync работает только в MySQL, async — только в PostgreSQL"
        feedback: "Нет, оба режима есть в обеих СУБД."
      - text: "Разницы в гарантиях нет, только в названии"
        feedback: "Разница принципиальная — в момент подтверждения коммита."
    reference_answer: >
      Асинхронная: master коммитит, не дожидаясь реплики — быстро, но реплика
      может отставать. Синхронная: master ждёт подтверждения реплики — данные
      не теряются при сбое, но запись медленнее.

  - type: true_false
    text: "Чтение с асинхронной реплики сразу после записи в master может вернуть устаревшие данные (replication lag)."
    correct: true
    reference_answer: >
      Из-за отставания реплики свежезаписанные данные могут ещё не дойти —
      классическая проблема read-your-writes.
