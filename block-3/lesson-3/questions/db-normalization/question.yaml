id: ""
difficulty: 3
tags: [db, normalization, modeling]

variants:
  - type: categorize
    text: "Раздели утверждения: что относится к нормализации, а что к денормализации?"
    categories:
      - name: "Нормализация"
        items:
          - "Устранение дублирования данных"
          - "Каждый факт хранится в одном месте"
          - "Атомарные значения в ячейках (1NF)"
          - "Нет транзитивных зависимостей (3NF)"
      - name: "Денормализация"
        items:
          - "Намеренное дублирование ради скорости чтения"
          - "Меньше JOIN-ов в запросах"
          - "Хранение готовых агрегатов"
    distractors:
      - "Шардирование по user_id"
      - "Создание B-tree индекса"

  - type: multiple_choice
    text: "Что требует 1NF (первая нормальная форма)?"
    options:
      - text: "Атомарность значений: одна ячейка — одно значение, без списков в колонке"
        correct: true
        feedback: "Верно. 1NF запрещает хранить массивы вроде 'тел1, тел2' в одной колонке."
      - text: "Отсутствие транзитивных зависимостей"
        feedback: "Это 3NF, а не 1NF."
      - text: "Зависимость атрибутов от всего составного ключа"
        feedback: "Это 2NF."
      - text: "Обязательное наличие внешних ключей"
        feedback: "FK не имеют отношения к 1NF."
    reference_answer: >
      1NF требует атомарных значений: одна ячейка — одно неделимое значение,
      без вложенных списков и повторяющихся групп.
