id: 25d0ac15-1d8d-4d22-962b-09a37923e047
difficulty: 4
tags: [db, sharding, partitioning, scaling]

variants:
  - type: multiple_choice
    text: "В чём ключевое отличие шардирования от партиционирования?"
    options:
      - text: "Шардирование разносит данные по разным серверам, партиционирование разбивает таблицу внутри одной БД"
        correct: true
        feedback: "Верно. Шард — это отдельный сервер, партиция — часть таблицы на том же сервере."
      - text: "Это одно и то же"
        feedback: "Нет: разный уровень — серверы против одной таблицы."
      - text: "Партиционирование всегда по серверам, шардирование — внутри таблицы"
        feedback: "Наоборот."
      - text: "Шардирование работает только для чтения"
        feedback: "Нет, шардирование масштабирует и запись."
    reference_answer: >
      Партиционирование — разбиение одной таблицы на части внутри одной БД
      (range/list/hash). Шардирование — разнесение данных по разным серверам
      по ключу шардирования.

  - type: categorize
    text: "Раздели характеристики по подходу:"
    categories:
      - name: "Шардирование"
        items:
          - "Данные на разных серверах"
          - "Масштабирует объём за пределы одного сервера"
          - "JOIN между частями сложны и дороги"
      - name: "Партиционирование"
        items:
          - "Разбиение одной таблицы внутри одной БД"
          - "Range/list/hash партиции"
          - "Можно быстро удалить старую партицию (DROP)"
    distractors:
      - "Кеширование результатов в Redis"
