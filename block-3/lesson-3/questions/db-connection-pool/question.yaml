id: ba96ab38-ada4-41a7-ad86-dc9edea45238
difficulty: 3
tags: [db, postgresql, connection-pool, pgbouncer]

variants:
  - type: multiple_choice
    text: "Зачем нужен пул соединений (например, PgBouncer) перед PostgreSQL?"
    options:
      - text: "Каждое соединение в PostgreSQL — отдельный процесс; пул переиспользует соединения и ограничивает их число"
        correct: true
        feedback: "Верно. Открытие коннекта дорого, а много процессов перегружают сервер."
      - text: "Чтобы шифровать трафик между приложением и БД"
        feedback: "Шифрование — это TLS, а не задача пула соединений."
      - text: "Чтобы автоматически создавать индексы"
        feedback: "Пул не имеет отношения к индексам."
      - text: "Чтобы реплицировать данные на другие серверы"
        feedback: "Это задача репликации, а не пула."
    reference_answer: >
      В PostgreSQL каждое соединение — это backend-процесс, открытие дорого,
      а большое их число перегружает сервер. Пул (PgBouncer) переиспользует
      соединения и держит их число под контролем.

  - type: true_false
    text: "Открытие нового соединения с БД на каждый запрос — дорогая операция, поэтому соединения переиспользуют через пул."
    correct: true
    reference_answer: >
      Установка соединения включает TCP-хендшейк, аутентификацию и создание
      backend-процесса, поэтому пул переиспользует уже открытые соединения.
