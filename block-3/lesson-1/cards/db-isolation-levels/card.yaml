id: 62d59f38-6843-469d-92bb-d979619993f5
difficulty: 3
tags: [db, transactions, isolation]

questions:
  - type: ordering
    text: "Расположи уровни изоляции от самого слабого к самому строгому:"
    items:
      - "Read Uncommitted"
      - "Read Committed"
      - "Repeatable Read"
      - "Serializable"

  - type: multiple_choice
    text: "Какой уровень изоляции используется в PostgreSQL по умолчанию?"
    options:
      - text: "Read Committed"
        correct: true
        feedback: "Верно. Дефолт PostgreSQL — Read Committed."
      - text: "Read Uncommitted"
        feedback: "В PostgreSQL он фактически работает как Read Committed, но дефолт — именно Read Committed."
      - text: "Repeatable Read"
        feedback: "Это дефолт MySQL/InnoDB, не PostgreSQL."
      - text: "Serializable"
        feedback: "Слишком строгий для дефолта; включается явно при необходимости."
    reference_answer: >
      Дефолт PostgreSQL — Read Committed. У MySQL/InnoDB по умолчанию
      Repeatable Read.
