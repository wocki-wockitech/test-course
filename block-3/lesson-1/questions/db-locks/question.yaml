id: ""
difficulty: 3
tags: [db, locks, concurrency]

variants:
  - type: multiple_choice
    text: "Чем оптимистичная блокировка отличается от пессимистичной?"
    options:
      - text: "Оптимистичная проверяет версию при записи и ретраит при конфликте; пессимистичная заранее блокирует строку"
        correct: true
        feedback: "Верно. Оптимистичная — без удержания лока, пессимистичная — SELECT ... FOR UPDATE."
      - text: "Оптимистичная всегда блокирует таблицу, пессимистичная — строку"
        feedback: "Нет, оптимистичная вообще не держит блокировку."
      - text: "Это просто два названия одного и того же механизма"
        feedback: "Нет, подходы принципиально разные."
      - text: "Пессимистичная работает только в NoSQL"
        feedback: "Нет, FOR UPDATE — это классический SQL."
    reference_answer: >
      Пессимистичная блокирует строку заранее (FOR UPDATE) — хороша при высокой
      конкуренции. Оптимистичная проверяет version/updated_at при записи и
      повторяет транзакцию при конфликте — хороша при низкой конкуренции.

  - type: true_false
    text: "`SELECT ... FOR UPDATE` — это пример пессимистичной блокировки."
    correct: true
    reference_answer: >
      FOR UPDATE блокирует выбранные строки до конца транзакции, заставляя
      других ждать — это пессимистичный подход.
