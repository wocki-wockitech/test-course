id: ""
difficulty: 4
tags: [db, transactions, isolation, anomalies]

variants:
  - type: matching
    text: "Сопоставь минимальный уровень изоляции, который устраняет аномалию:"
    pairs:
      - left: "Dirty read"
        right: "Read Committed"
      - left: "Non-repeatable read"
        right: "Repeatable Read"
      - left: "Phantom read"
        right: "Serializable"
      - left: "Любые аномалии параллельного доступа"
        right: "Serializable"

  - type: matching
    text: "Сопоставь аномалию с её описанием:"
    pairs:
      - left: "Dirty read"
        right: "Чтение незакоммиченных данных другой транзакции"
      - left: "Non-repeatable read"
        right: "Повторное чтение строки даёт другое значение"
      - left: "Phantom read"
        right: "Повторный запрос по диапазону возвращает новые строки"
      - left: "Lost update"
        right: "Одно обновление затирает другое"
