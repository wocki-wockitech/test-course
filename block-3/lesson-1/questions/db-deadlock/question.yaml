id: f53fcfe4-73ab-4255-a337-4ec7bedb0ad7
difficulty: 3
tags: [db, deadlock, locks]

variants:
  - type: multiple_choice
    text: "Какой приём надёжнее всего снижает вероятность deadlock?"
    options:
      - text: "Захватывать ресурсы в одном и том же порядке во всех транзакциях"
        correct: true
        feedback: "Верно. Единый порядок захвата ломает циклическое ожидание."
      - text: "Повышать уровень изоляции до Serializable"
        feedback: "Это не убирает deadlock, а часто добавляет ошибки сериализации."
      - text: "Делать транзакции как можно длиннее"
        feedback: "Наоборот — длинные транзакции увеличивают риск deadlock."
      - text: "Отключить блокировки совсем"
        feedback: "Так нельзя обеспечить корректность параллельной записи."
    reference_answer: >
      Deadlock возникает при циклическом ожидании блокировок. Единый порядок
      захвата ресурсов + короткие транзакции + ретрай при ошибке — рабочая
      стратегия.

  - type: true_false
    text: "При deadlock СУБД сама обнаруживает цикл и аварийно завершает одну из транзакций."
    correct: true
    reference_answer: >
      Детектор взаимоблокировок находит цикл ожидания и откатывает одну
      транзакцию (жертву), вторая продолжает работу.
