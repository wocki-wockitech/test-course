id: 2d460f31-c286-4368-ab7b-36863c2cb70e
difficulty: 4
tags: [db, postgresql, mvcc, concurrency]

variants:
  - type: multiple_choice
    text: "Как MVCC в PostgreSQL обеспечивает изоляцию читателей и писателей?"
    options:
      - text: "Хранит несколько версий строки; каждая транзакция читает свой снапшот, читатели не блокируют писателей"
        correct: true
        feedback: "Верно. Обновление создаёт новую версию строки, чтение идёт из снапшота."
      - text: "Блокирует таблицу целиком на время записи"
        feedback: "Нет, MVCC как раз позволяет избежать блокировки на чтении."
      - text: "Читатели всегда ждут завершения писателей"
        feedback: "Наоборот: суть MVCC в том, что читатели не блокируют писателей и наоборот."
      - text: "Сериализует все запросы в одну очередь"
        feedback: "Это не про MVCC; это поведение строгой блокировочной модели."
    reference_answer: >
      MVCC создаёт новые версии строк при обновлении. Каждая транзакция видит
      снапшот данных, поэтому читатели не блокируют писателей.

  - type: true_false
    text: "В PostgreSQL мёртвые (старые) версии строк удаляет процесс VACUUM."
    correct: true
    reference_answer: >
      VACUUM убирает версии строк, которые больше никому не видны. Без него
      растёт bloat таблиц и индексов.
