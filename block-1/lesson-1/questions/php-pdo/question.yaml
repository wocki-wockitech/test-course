id: 93eb40ca-a1a6-4c97-99e1-153e4647c746
difficulty: 3
tags: [php, pdo, sql-injection, security]

variants:
  - type: multiple_choice
    text: "Посмотри на два варианта запроса в файле. Выбери все верные утверждения:"
    file: main.php
    options:
      - text: "Вариант A уязвим к SQL-инъекции"
        correct: true
        feedback: "Верно. В A переменная $id подставляется в строку напрямую — атакующий может изменить структуру запроса."
      - text: "Вариант B защищён от SQL-инъекции благодаря параметризации"
        correct: true
        feedback: "Верно. Prepared statement передаёт данные отдельно от SQL — драйвер сам экранирует значение."
      - text: "Именованные параметры (:id) делают запрос уязвимым"
        feedback: "Наоборот, именованные параметры — это безопасный способ привязки данных."
      - text: "Оба варианта одинаково безопасны, если $id — число"
        feedback: "Нет. Даже если сейчас $id — число, завтра это может измениться. Prepared statements защищают по дизайну."
      - text: "PDO::prepare() отправляет запрос и данные раздельно на уровне протокола"
        correct: true
        feedback: "Верно (при эмуляции выключенной). Это ключевой механизм защиты — данные не могут изменить структуру SQL."
    reference_answer: >
      Вариант A склеивает пользовательский ввод прямо в SQL — классическая
      SQL-инъекция. Вариант B использует подготовленный запрос с параметром:
      данные передаются отдельно от текста запроса, поэтому ввод не может
      изменить структуру SQL. Всегда используй prepared statements.

  - type: true_false
    text: "Подготовленные запросы (prepared statements) с привязкой параметров защищают от SQL-инъекций."
    correct: true
    reference_answer: >
      Данные передаются отдельно от текста запроса, поэтому ввод не может
      изменить структуру SQL.
