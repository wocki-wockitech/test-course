id: ""
difficulty: 3
tags: [php, pdo, sql-injection, security]

variants:
  - type: multiple_choice
    text: "Сравни два варианта запроса в файле. Что верно?"
    file: main.php
    options:
      - text: "Вариант A уязвим к SQL-инъекции, вариант B — безопасный (prepared statement)"
        correct: true
        feedback: "Верно. A подставляет $id в строку напрямую, B использует параметризацию."
      - text: "Оба варианта безопасны"
        feedback: "Нет, в A пользовательский ввод склеивается в SQL-строку."
      - text: "Вариант B уязвим, потому что использует именованные параметры"
        feedback: "Наоборот, именованные параметры — это безопасный способ."
      - text: "Оба варианта уязвимы"
        feedback: "B параметризован и защищён от инъекции."
    reference_answer: >
      Вариант A склеивает пользовательский ввод прямо в SQL — классическая
      SQL-инъекция. Вариант B использует подготовленный запрос с параметром,
      драйвер сам экранирует значение. Всегда используй prepared statements.

  - type: true_false
    text: "Подготовленные запросы (prepared statements) с привязкой параметров защищают от SQL-инъекций."
    correct: true
    reference_answer: >
      Данные передаются отдельно от текста запроса, поэтому ввод не может
      изменить структуру SQL.
