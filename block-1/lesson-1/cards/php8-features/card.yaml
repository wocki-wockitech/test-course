id: e64ea981-3519-4fe5-86dc-2d22d344860b
difficulty: 2
tags: [php, php8, features]

questions:
  - type: categorize
    text: "Раздели возможности по версиям, в которых они появились:"
    categories:
      - name: "PHP 8.0"
        items: ["JIT", "match-выражение", "named arguments", "constructor property promotion", "union types"]
      - name: "PHP 8.1"
        items: ["enum", "readonly свойства", "fibers"]
    distractors:
      - "goroutines"
      - "generics на уровне рантайма"

  - type: multiple_choice
    text: "Что делает `declare(strict_types=1);`?"
    options:
      - text: "Запрещает неявное приведение скалярных типов в этом файле"
        correct: true
        feedback: "Да. Например, int не будет молча кастоваться в string при передаче в типизированную функцию."
      - text: "Включает JIT"
        feedback: "Нет, JIT настраивается в opcache."
      - text: "Делает все свойства readonly"
        feedback: "Нет, это про readonly-модификатор."
      - text: "Включает строгий режим только для классов"
        feedback: "Это про скалярные типы аргументов/возврата."

  - type: multiple_choice
    text: "Чем `match` отличается от `switch` в PHP 8?"
    options:
      - text: "`match` использует строгое сравнение и возвращает значение, без fallthrough"
        correct: true
        feedback: "Верно. switch использует == и проваливается без break."
      - text: "`match` медленнее switch"
        feedback: "Дело не в скорости, а в семантике сравнения и возврата."
      - text: "`match` работает только с числами"
        feedback: "Нет, работает с любыми значениями."
      - text: "Разницы нет"
        feedback: "Есть: строгое сравнение, возврат значения, обязательная полнота."
