difficulty: 2
tags: [php, types, comparison]

questions:
  - type: multiple_choice
    text: "Чем отличается `==` от `===` в PHP?"
    options:
      - text: "`==` сравнивает с приведением типов, `===` — по типу и значению"
        correct: true
        feedback: "Верно. `===` строгое: и тип, и значение должны совпасть."
      - text: "Это синонимы, разницы нет"
        feedback: "Нет, `==` делает type juggling, `===` — нет."
      - text: "`===` сравнивает только ссылки, `==` — значения"
        feedback: "Это не про PHP-скаляры; для объектов `==` сравнивает поля, `===` — идентичность."
      - text: "`==` работает только с числами"
        feedback: "Нет, `==` работает с любыми типами."
    reference_answer: >
      `==` — нестрогое сравнение с приведением типов. `===` — строгое: тип
      и значение. По умолчанию используй `===`, чтобы избежать неожиданных
      кастов.

  - type: true_false
    text: "В PHP 8 выражение `0 == \"foo\"` возвращает `false`."
    correct: true
    reference_answer: >
      В PHP 8 строка не кастуется молча в 0. В PHP 7 это было `true`.
