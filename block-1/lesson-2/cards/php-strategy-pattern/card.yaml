id: 14b672ec-0547-42ba-9e1d-06cf45aba062
difficulty: 3
tags: [php, patterns, strategy, oop]

questions:
  - type: multiple_choice
    text: "Какой паттерн проектирования реализован в коде?"
    file: main.php
    options:
      - text: "Strategy — взаимозаменяемые алгоритмы за общим интерфейсом"
        correct: true
        feedback: "Верно. report() работает с любым Exporter, реализацию подменяем."
      - text: "Singleton"
        feedback: "Здесь нет единственного экземпляра."
      - text: "Observer"
        feedback: "Нет подписки на события."
      - text: "Factory"
        feedback: "Объекты не создаются фабрикой внутри кода."
    reference_answer: >
      Это Strategy: общий интерфейс Exporter и несколько взаимозаменяемых
      реализаций, которые клиент (report) использует, не зная конкретики.

  - type: multiple_choice
    text: "Какой принцип SOLID лучше всего иллюстрирует этот код?"
    file: main.php
    options:
      - text: "Open/Closed — добавить новый формат можно новым классом, не меняя report()"
        correct: true
        feedback: "Верно: новое поведение через новую реализацию интерфейса."
      - text: "Single Responsibility и только он"
        feedback: "SRP тоже есть, но ключевое тут — расширяемость без правок."
      - text: "Никакой принцип тут не применим"
        feedback: "Применим как минимум OCP и DIP."
      - text: "Liskov Substitution"
        feedback: "LSP про подстановку подклассов, тут это не основная идея."
