id: 2f0d6b74-d010-4fbb-b191-d830a220a1d9
difficulty: 2
tags: [php, solid, architecture]

questions:
  - type: multiple_choice
    text: "Что означает буква S в SOLID (Single Responsibility)?"
    options:
      - text: "У класса должна быть одна причина для изменения"
        correct: true
        feedback: "Верно. Один класс — одна ответственность."
      - text: "У класса должен быть один метод"
        feedback: "Нет, речь про причину изменения, а не число методов."
      - text: "У приложения должен быть один класс"
        feedback: "Это абсурд, не про это."
      - text: "Класс должен наследоваться только от одного родителя"
        feedback: "Это про наследование, не про SRP."
    reference_answer: >
      SRP: класс отвечает за одну вещь и меняется по одной причине. Парсинг,
      бизнес-логику и запись в БД не смешивают в одном классе.

  - type: matching
    text: "Сопоставь принцип SOLID с его сутью:"
    pairs:
      - left: "Open/Closed"
        right: "Открыт для расширения, закрыт для изменения"
      - left: "Liskov Substitution"
        right: "Подкласс заменяет родителя без поломки поведения"
      - left: "Interface Segregation"
        right: "Несколько узких интерфейсов вместо одного толстого"
      - left: "Dependency Inversion"
        right: "Зависим от абстракций, а не от конкретики"
