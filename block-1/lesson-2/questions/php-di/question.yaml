id: 56e6e158-0b2b-43da-a669-968bdbca591b
difficulty: 3
tags: [php, di, architecture, testing]

variants:
  - type: multiple_choice
    text: "В чём главный практический плюс Dependency Injection?"
    options:
      - text: "Снижается связанность и упрощается тестирование (зависимости можно подменить моком)"
        correct: true
        feedback: "Верно. Передаём зависимости снаружи — легко мокать и менять реализацию."
      - text: "Код всегда работает быстрее"
        feedback: "DI про связанность и тестируемость, а не про скорость."
      - text: "Не нужно писать интерфейсы"
        feedback: "Скорее наоборот, DI хорошо сочетается с абстракциями."
      - text: "Исчезают все исключения"
        feedback: "DI не связан с обработкой ошибок."
    reference_answer: >
      DI передаёт зависимости извне (обычно через конструктор), что снижает
      связанность и позволяет подставлять моки в тестах.

  - type: true_false
    text: "DI-контейнер и Dependency Injection — это одно и то же."
    correct: false
    reference_answer: >
      DI — это паттерн (передача зависимостей снаружи). Контейнер — инструмент,
      который автоматически собирает граф зависимостей. Можно делать DI без
      контейнера, вручную.
