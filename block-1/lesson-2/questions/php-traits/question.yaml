id: 55ddc189-8e65-487d-a00a-30d6d6c594e3
difficulty: 2
tags: [php, oop, traits, psr]

variants:
  - type: multiple_choice
    text: "Зачем нужны трейты в PHP?"
    options:
      - text: "Переиспользовать методы в нескольких классах без наследования"
        correct: true
        feedback: "Верно. Трейт «вмешивается» в класс, обходя отсутствие множественного наследования."
      - text: "Создавать единственный экземпляр класса"
        feedback: "Это Singleton, не трейт."
      - text: "Хранить конфигурацию приложения"
        feedback: "Нет, это не назначение трейтов."
      - text: "Заменять интерфейсы"
        feedback: "Трейт даёт реализацию, интерфейс — контракт; они дополняют друг друга."

  - type: matching
    text: "Сопоставь PSR-стандарт с его назначением:"
    pairs:
      - left: "PSR-4"
        right: "Автозагрузка классов по неймспейсам"
      - left: "PSR-7"
        right: "HTTP-сообщения (Request/Response)"
      - left: "PSR-11"
        right: "Интерфейс DI-контейнера"
      - left: "PSR-3"
        right: "Интерфейс логгера"
    distractors:
      - "Формат конфигурации Kubernetes"
