id: 2c1bbf74-55c1-45ef-ae1c-3c838a131bb6
difficulty: 2
tags: [php, oop, interfaces]

variants:
  - type: multiple_choice
    text: "Чем интерфейс отличается от абстрактного класса в PHP?"
    options:
      - text: "Интерфейс задаёт контракт без реализации, абстрактный класс может иметь реализацию; интерфейсов можно реализовать много, класс наследуется один"
        correct: true
        feedback: "Верно — ключевое различие в реализации и множественности."
      - text: "Разницы нет"
        feedback: "Есть существенная разница."
      - text: "Абстрактный класс нельзя наследовать"
        feedback: "Наоборот, он создан для наследования."
      - text: "Интерфейс может хранить состояние (свойства)"
        feedback: "Нет, интерфейс не хранит обычные свойства."
    reference_answer: >
      Интерфейс — чистый контракт, без реализации и состояния, реализовать
      можно несколько. Абстрактный класс может содержать реализацию и поля,
      но наследоваться можно только от одного.

  - type: true_false
    text: "В PHP трейты позволяют переиспользовать код горизонтально без наследования."
    correct: true
    reference_answer: >
      Трейты «вмешивают» методы в класс, обходя отсутствие множественного
      наследования.
