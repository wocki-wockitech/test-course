id: bda5b372-c642-470b-a698-6f3edc158f2d
difficulty: 3
tags: [go, errors, wrapping]

questions:
  - type: multiple_choice
    text: "Что делает глагол `%w` в `fmt.Errorf`?"
    options:
      - text: "Оборачивает исходную ошибку, сохраняя её в цепочке для errors.Is/As"
        correct: true
        feedback: "Верно. %w создаёт обёртку, из которой исходную ошибку можно достать."
      - text: "Форматирует ошибку как строку без сохранения цепочки"
        feedback: "Это делает %v или %s. %w именно оборачивает с сохранением цепочки."
      - text: "Подавляет ошибку и возвращает nil"
        feedback: "Нет, %w не подавляет ничего."
      - text: "Логирует ошибку в stderr"
        feedback: "fmt.Errorf не логирует, он создаёт значение error."
    reference_answer: >
      %w оборачивает исходную ошибку, сохраняя её в цепочке. Потом
      errors.Is проверит наличие конкретной ошибки, а errors.As достанет
      ошибку нужного типа.

  - type: multiple_choice
    text: "Чем нужно проверять, есть ли в цепочке ошибок конкретная sentinel-ошибка (например io.EOF)?"
    options:
      - text: "errors.Is(err, io.EOF)"
        correct: true
        feedback: "Верно. errors.Is разворачивает цепочку и сравнивает с целевой ошибкой."
      - text: "err == io.EOF"
        feedback: "Прямое сравнение не работает, если ошибка обёрнута через %w."
      - text: "strings.Contains(err.Error(), \"EOF\")"
        feedback: "Сравнение по строке — антипаттерн, хрупко и ненадёжно."
      - text: "errors.As(err, io.EOF)"
        feedback: "errors.As нужен для извлечения по типу и принимает указатель на переменную типа."
    reference_answer: >
      errors.Is(err, target) разворачивает цепочку обёрток (через %w) и
      сравнивает каждый уровень с целевой ошибкой. Прямое == ломается на
      обёрнутых ошибках.
