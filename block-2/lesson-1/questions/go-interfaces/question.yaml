id: ""
difficulty: 3
tags: [go, interfaces, polymorphism]

variants:
  - type: multiple_choice
    text: "Как тип в Go реализует интерфейс?"
    options:
      - text: "Неявно — достаточно иметь все методы интерфейса, без ключевого слова implements"
        correct: true
        feedback: "Верно. В Go структурная (неявная) реализация интерфейсов."
      - text: "Через ключевое слово `implements` в объявлении типа"
        feedback: "В Go нет implements; реализация неявная."
      - text: "Через наследование от интерфейса"
        feedback: "В Go нет наследования классов; интерфейсы реализуются набором методов."
      - text: "Через регистрацию типа в рантайме"
        feedback: "Ничего регистрировать не нужно — проверка статическая по набору методов."
    reference_answer: >
      Go использует неявную (структурную) реализацию: тип удовлетворяет
      интерфейсу автоматически, если у него есть все требуемые методы.
      Это позволяет объявлять интерфейсы на стороне потребителя.

  - type: true_false
    text: "Интерфейсная переменная в Go равна nil, только если и тип, и значение внутри неё nil."
    correct: true
    reference_answer: >
      Интерфейс хранит пару (тип, значение). Если положить в него
      nil-указатель конкретного типа, тип будет не nil, и сам интерфейс
      окажется != nil — классическая ловушка.

  - type: matching
    text: "Сопоставь понятие Go с его сутью:"
    pairs:
      - left: "any (interface{})"
        right: "Удовлетворяется значением любого типа"
      - left: "type assertion"
        right: "Извлечение конкретного типа из интерфейса"
      - left: "type switch"
        right: "Ветвление по динамическому типу значения"
      - left: "io.Reader"
        right: "Маленький интерфейс с одним методом Read"
