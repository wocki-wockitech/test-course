id: ""
difficulty: 3
tags: [go, methods, receivers, struct]

variants:
  - type: multiple_choice
    text: "Когда стоит использовать pointer receiver вместо value receiver?"
    options:
      - text: "Когда метод меняет состояние структуры или структура большая (чтобы не копировать)"
        correct: true
        feedback: "Верно. Pointer receiver мутирует оригинал и избегает копирования больших структур."
      - text: "Всегда, value receiver использовать нельзя"
        feedback: "Value receiver вполне уместен для маленьких неизменяемых типов."
      - text: "Только когда структура реализует интерфейс"
        feedback: "Это не критерий выбора receiver-а."
      - text: "Только для приватных методов"
        feedback: "Видимость метода не связана с типом receiver-а."
    reference_answer: >
      Pointer receiver нужен, когда метод изменяет состояние, либо структура
      крупная и копировать её дорого, либо для консистентности набора методов.
      Маленькие неизменяемые типы можно держать на value receiver.

  - type: true_false
    text: "Метод с value receiver работает с копией структуры, поэтому его изменения полей не видны вызывающему коду."
    correct: true
    reference_answer: >
      Value receiver получает копию, и мутации полей не затрагивают оригинал.
      Чтобы менять оригинал, нужен pointer receiver.
