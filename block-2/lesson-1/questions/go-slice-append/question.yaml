id: 1b636f72-00f5-436d-bb5c-d998952bd6ee
difficulty: 4
tags: [go, slice, append, capacity]

variants:
  - type: multiple_choice
    text: "Что выведет программа из файла?"
    file: main.go
    options:
      - text: "[1 2 99] и [1 2 99]"
        correct: true
        feedback: "Верно. У a хватает cap, append пишет в общий массив и перетирает s[2] на 99."
      - text: "[1 2 3] и [1 2 99]"
        feedback: "Нет. a и s делят один массив; cap у a == 5, поэтому append не реаллоцирует и меняет s[2]."
      - text: "[1 2 3] и [1 2 3 99]"
        feedback: "У a длина станет 3, а не 4: a = s[:2] имеет len=2, после append len=3."
      - text: "panic: index out of range"
        feedback: "Паники нет: cap достаточно для append."
    reference_answer: >
      a = s[:2] имеет len=2, cap=5 и делит нижележащий массив с s. Так как
      ёмкости хватает, append(a, 99) пишет в существующий массив по индексу 2,
      перетирая s[2]. Оба слайса печатают [1 2 99].

  - type: true_false
    text: "Если append превышает cap слайса, Go выделяет новый массив и копирует данные, и исходный массив больше не затрагивается."
    correct: true
    reference_answer: >
      При нехватке ёмкости append реаллоцирует новый массив большего размера
      и копирует элементы. Тогда связь с прежним массивом теряется.
