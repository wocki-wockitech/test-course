id: 9e4fc806-5b1b-4d28-8c3f-c706680f9f54
difficulty: 3
tags: [go, worker-pool, concurrency, patterns]

variants:
  - type: multiple_choice
    text: "Зачем применяют паттерн worker pool?"
    options:
      - text: "Чтобы ограничить число одновременно работающих горутин фиксированным пулом воркеров"
        correct: true
        feedback: "Верно. Пул сдерживает конкурентность и нагрузку на ресурсы."
      - text: "Чтобы запускать как можно больше горутин на каждую задачу"
        feedback: "Наоборот — пул ограничивает число горутин, чтобы не перегрузить систему."
      - text: "Чтобы избавиться от каналов"
        feedback: "Worker pool как раз строится на каналах jobs/results."
      - text: "Чтобы ускорить однопоточный код без конкурентности"
        feedback: "Worker pool — это про управляемую конкурентность."
    reference_answer: >
      Worker pool ограничивает конкурентность: фиксированное число воркеров
      читает задачи из общего канала jobs и пишет результаты в results. Это
      защищает от неконтролируемого роста горутин и перегрузки ресурсов
      (БД, сеть, CPU).

  - type: true_false
    text: "В worker pool канал задач (jobs) должен закрывать отправитель, чтобы воркеры завершили цикл `for range`."
    correct: true
    reference_answer: >
      Закрытие jobs отправителем завершает `for j := range jobs` у воркеров.
      Закрывать должен отправитель, иначе возможна паника или вечная блокировка.
