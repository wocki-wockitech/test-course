id: ""
difficulty: 4
tags: [go, data-race, waitgroup, concurrency]

variants:
  - type: multiple_choice
    text: "Что не так с кодом в файле и что он напечатает?"
    file: main.go
    options:
      - text: "Тут data race на counter++; итог недетерминирован и обычно меньше 1000"
        correct: true
        feedback: "Верно. counter++ не атомарна, горутины затирают приращения друг друга — гонка данных."
      - text: "Всё корректно, всегда напечатает 1000"
        feedback: "Нет. counter++ — это чтение-инкремент-запись без синхронизации, итог недетерминирован."
      - text: "Будет deadlock на wg.Wait()"
        feedback: "Нет, WaitGroup использован правильно: Add до go, Done через defer."
      - text: "Ошибка компиляции из-за замыкания"
        feedback: "Код компилируется; проблема в рантайме — data race."
    reference_answer: >
      counter++ выполняется конкурентно из 1000 горутин без блокировки —
      это data race. Операция не атомарна (читай-инкремент-пиши), поэтому
      приращения теряются, и результат обычно меньше 1000 и недетерминирован.
      go run -race это обнаружит. Чинится мьютексом или sync/atomic.

  - type: multiple_choice
    text: "Как корректно устранить data race на счётчике, который инкрементируют много горутин?"
    options:
      - text: "Защитить инкремент sync.Mutex или использовать atomic.AddInt64"
        correct: true
        feedback: "Верно. Мьютекс или атомарные операции делают доступ безопасным."
      - text: "Добавить time.Sleep перед инкрементом"
        feedback: "Sleep не устраняет гонку, только маскирует её и замедляет код."
      - text: "Сделать counter глобальной переменной"
        feedback: "Глобальность не добавляет синхронизации — гонка останется."
      - text: "Увеличить число горутин"
        feedback: "Это только усугубит гонку."
    reference_answer: >
      Конкурентный доступ к счётчику синхронизируют либо sync.Mutex вокруг
      инкремента, либо атомарными операциями sync/atomic. Можно также
      аккумулировать через канал.
