id: d5e2cc93-44cc-4561-8b33-06a4de37bb65
difficulty: 3
tags: [go, channels, concurrency]

questions:
  - type: multiple_choice
    text: "Чем отличается буферизованный канал от небуферизованного?"
    options:
      - text: "Небуферизованный синхронный (отправка ждёт приём), буферизованный блокирует только при полном буфере"
        correct: true
        feedback: "Верно. Небуферизованный — рандеву; буферизованный позволяет отправить до заполнения буфера."
      - text: "Буферизованный канал нельзя закрыть"
        feedback: "Закрыть можно любой канал."
      - text: "Небуферизованный канал быстрее"
        feedback: "Дело не в скорости, а в семантике блокировки."
      - text: "Разницы нет, буфер влияет только на память"
        feedback: "Разница принципиальная — в том, когда отправка/приём блокируются."
    reference_answer: >
      Небуферизованный канал синхронный: отправка блокируется до приёма
      (рандеву). Буферизованный блокирует отправку только когда буфер полон,
      а приём — когда буфер пуст.

  - type: true_false
    text: "Запись в закрытый канал вызывает панику."
    correct: true
    reference_answer: >
      Отправка в закрытый канал — panic: send on closed channel. Поэтому
      закрывает канал отправитель, а не получатель.

  - type: ordering
    text: "Расположи правильную последовательность работы с каналом в worker pool:"
    items:
      - "Создать каналы jobs и results"
      - "Запустить горутины-воркеры, читающие из jobs"
      - "Отправить задачи в jobs"
      - "Закрыть канал jobs (отправитель)"
      - "Собрать результаты из results"
