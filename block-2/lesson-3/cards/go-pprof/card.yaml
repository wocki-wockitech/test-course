id: 643511dc-fae2-44ee-beed-ffd4308791de
difficulty: 3
tags: [go, pprof, profiling, performance]

questions:
  - type: multiple_choice
    text: "Что позволяет профилировать pprof в Go?"
    options:
      - text: "CPU, heap (память), горутины, блокировки и мьютексы"
        correct: true
        feedback: "Верно. pprof собирает разные профили: CPU, heap, goroutine, block, mutex."
      - text: "Только использование CPU"
        feedback: "pprof умеет больше: память, горутины, блокировки и т.д."
      - text: "Только сетевой трафик"
        feedback: "Сеть — не задача pprof; он про CPU, память, горутины."
      - text: "Покрытие тестами"
        feedback: "Покрытие — это go test -cover, а не pprof."
    reference_answer: >
      pprof собирает профили CPU, heap (аллокации памяти), goroutine, block
      и mutex. В вебе подключают net/http/pprof (эндпоинты /debug/pprof/),
      а в бенчмарках — флаги -cpuprofile/-memprofile.

  - type: multiple_choice
    text: "Как подключить pprof-эндпоинты в HTTP-сервисе?"
    options:
      - text: "Импортировать net/http/pprof с blank-импортом, он зарегистрирует /debug/pprof/"
        correct: true
        feedback: "Верно. `import _ \"net/http/pprof\"` регистрирует обработчики на DefaultServeMux."
      - text: "Вызвать pprof.Start() в начале main"
        feedback: "Такой функции нет; для веба используют пакет net/http/pprof."
      - text: "Установить переменную окружения PPROF=1"
        feedback: "Такой переменной нет."
      - text: "Добавить флаг -pprof при сборке"
        feedback: "Профилирование подключается импортом пакета, а не флагом сборки."
    reference_answer: >
      Blank-импорт `import _ "net/http/pprof"` регистрирует обработчики
      /debug/pprof/ на DefaultServeMux. Дальше профиль снимают командой
      go tool pprof http://host:port/debug/pprof/heap (или profile, goroutine).

  - type: true_false
    text: "go tool pprof умеет строить интерактивный граф вызовов и список самых «тяжёлых» функций по собранному профилю."
    correct: true
    reference_answer: >
      go tool pprof анализирует профиль: показывает top-функции, граф вызовов,
      flame graph (через web), помогая найти узкие места по CPU или памяти.
