id: ed51a677-68b5-4d79-8cf1-d777659c3df5
difficulty: 3
tags: [go, gc, memory, runtime]

variants:
  - type: multiple_choice
    text: "Какой сборщик мусора используется в Go?"
    options:
      - text: "Конкурентный трёхцветный mark-and-sweep с короткими stop-the-world паузами"
        correct: true
        feedback: "Верно. GC работает параллельно с программой и оптимизирован под низкие паузы."
      - text: "Подсчёт ссылок (reference counting), как в PHP"
        feedback: "Нет, в Go не reference counting, а трёхцветный mark-and-sweep."
      - text: "Поколенческий (generational) сборщик"
        feedback: "GC в Go не поколенческий; это конкурентный mark-and-sweep."
      - text: "Сборки мусора нет, память освобождается вручную"
        feedback: "В Go есть автоматический GC."
    reference_answer: >
      Go использует конкурентный трёхцветный mark-and-sweep с write barrier.
      Он работает параллельно с приложением, паузы stop-the-world обычно
      меньше миллисекунды. Цель — низкая latency, а не максимальный throughput.

  - type: multiple_choice
    text: "Как уменьшить нагрузку на GC в Go?"
    options:
      - text: "Сократить аллокации в куче: переиспользовать буферы (sync.Pool), избегать лишних указателей"
        correct: true
        feedback: "Верно. Меньше аллокаций в куче → реже срабатывает GC → стабильнее latency."
      - text: "Чаще вызывать runtime.GC() вручную"
        feedback: "Это обычно вредит — принудительные сборки добавляют пауз."
      - text: "Отключить GC через GOGC=off в проде"
        feedback: "Отключение GC ведёт к неограниченному росту памяти — опасно."
      - text: "Увеличить число горутин"
        feedback: "Число горутин не уменьшает аллокации в куче."
    reference_answer: >
      GC нагружают аллокации в куче. Снижают их переиспользованием объектов
      (sync.Pool), сокращением escape в кучу, предвыделением слайсов. Реже
      аллокации — реже работает GC.

  - type: true_false
    text: "Переменная GOGC регулирует, при каком росте кучи запускается следующий цикл GC."
    correct: true
    reference_answer: >
      GOGC (по умолчанию 100) означает, что GC стартует, когда куча выросла
      на 100% относительно живого размера после прошлой сборки.
