id: ""
difficulty: 4
tags: [go, escape-analysis, memory, runtime]

variants:
  - type: multiple_choice
    text: "Где разместится переменная u в функции newUser (см. файл) и что это значит?"
    options:
      - text: "u убежит в кучу (escape), потому что на неё остаётся ссылка после возврата; код корректен и безопасен"
        correct: true
        feedback: "Верно. Escape analysis отправит u в кучу, и её соберёт GC, когда ссылка пропадёт."
      - text: "Ошибка: нельзя возвращать адрес локальной переменной"
        feedback: "В Go это безопасно — переменная просто убегает в кучу, не повисает."
      - text: "u останется на стеке и будет повреждена после возврата"
        feedback: "Нет, компилятор обнаружит escape и разместит u в куче, повреждения не будет."
      - text: "Будет dangling pointer и неопределённое поведение"
        feedback: "В Go нет dangling-указателей при возврате адреса локали — спасает escape analysis и GC."
    reference_answer: >
      Поскольку newUser возвращает &u, ссылка на u переживает функцию.
      Escape analysis на этапе компиляции решает разместить u в куче, а не на
      стеке. Это безопасно: указатель валиден, а память освободит GC. Проверить
      можно через go build -gcflags='-m'.

  - type: true_false
    text: "В Go возврат указателя на локальную переменную безопасен благодаря escape analysis."
    correct: true
    reference_answer: >
      Если переменная «убегает» за пределы функции, компилятор размещает её
      в куче, и указатель остаётся валидным. Память затем собирает GC.
