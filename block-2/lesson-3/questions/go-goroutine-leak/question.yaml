id: ""
difficulty: 4
tags: [go, goroutine-leak, concurrency, runtime]

variants:
  - type: multiple_choice
    text: "Что такое утечка горутины (goroutine leak)?"
    options:
      - text: "Горутина навсегда заблокирована и не завершается, удерживая память стека и ресурсы"
        correct: true
        feedback: "Верно. Заблокированная навсегда горутина не собирается GC и течёт."
      - text: "Горутина, которая потребляет слишком много CPU"
        feedback: "Это про нагрузку, а не про утечку. Утечка — это незавершающаяся горутина."
      - text: "Ошибка компиляции при запуске go-функции"
        feedback: "Утечка — рантайм-проблема, не ошибка компиляции."
      - text: "Ситуация, когда GC удаляет работающую горутину"
        feedback: "GC не удаляет работающие горутины; утечка — обратное: горутина висит и не убирается."
    reference_answer: >
      Утечка горутины — это горутина, заблокированная навсегда (например, на
      чтении из канала, в который никто не пишет, или без сигнала отмены).
      Её стек и удерживаемые ресурсы не освобождаются. Лечится путём
      завершения: закрытие канала, ctx.Done(), таймаут в select.

  - type: multiple_choice
    text: "Какой профиль pprof поможет обнаружить утечку горутин?"
    options:
      - text: "goroutine — показывает число и стеки живых горутин"
        correct: true
        feedback: "Верно. Растущее число горутин в этом профиле — признак утечки."
      - text: "heap — показывает только аллокации памяти"
        feedback: "heap полезен для памяти, но утечку горутин нагляднее видно в профиле goroutine."
      - text: "cpu — показывает использование процессора"
        feedback: "CPU-профиль не отражает число заблокированных горутин."
      - text: "Утечку горутин нельзя обнаружить через pprof"
        feedback: "Можно: профиль goroutine на /debug/pprof/goroutine."
    reference_answer: >
      Профиль goroutine (/debug/pprof/goroutine) показывает количество и
      стеки активных горутин. Монотонный рост числа горутин со временем —
      типичный симптом утечки.
