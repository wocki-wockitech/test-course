id: ""
difficulty: 4
tags: [go, scheduler, gmp, runtime]

variants:
  - type: multiple_choice
    text: "Что обозначают буквы G, M и P в планировщике Go?"
    options:
      - text: "G — горутина, M — поток ОС, P — логический процессор (контекст планирования)"
        correct: true
        feedback: "Верно. G исполняется на M через P, число P задаётся GOMAXPROCS."
      - text: "G — группа, M — модуль, P — пакет"
        feedback: "Нет, это не про модульность."
      - text: "G — горутина, M — мьютекс, P — пул"
        feedback: "M — это поток ОС (machine), не мьютекс."
      - text: "G — GC, M — память, P — производительность"
        feedback: "Нет, это термины модели планирования горутин."
    reference_answer: >
      G (goroutine) — горутина, M (machine) — системный поток ОС, P
      (processor) — логический процессор, дающий контекст для исполнения.
      Чтобы исполнять код, M должен держать P; число P = GOMAXPROCS.

  - type: true_false
    text: "По умолчанию число P (GOMAXPROCS) равно числу доступных ядер CPU."
    correct: true
    reference_answer: >
      GOMAXPROCS по умолчанию равен числу логических ядер. Он ограничивает,
      сколько горутин может исполняться параллельно в каждый момент.

  - type: matching
    text: "Сопоставь механизм планировщика Go с его описанием:"
    pairs:
      - left: "Work stealing"
        right: "Простаивающий P забирает горутины из очереди другого P"
      - left: "GOMAXPROCS"
        right: "Сколько P (параллельных исполнителей) доступно"
      - left: "Локальная очередь P"
        right: "Очередь готовых горутин, привязанная к процессору"
      - left: "Preemption"
        right: "Вытеснение долгой горутины, чтобы не монополизировать P"
